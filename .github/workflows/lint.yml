---
name: Lint

'on':
  - push
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pipx install pre-commit

      - name: Test Codex file hooks
        run: python3 -m unittest discover -s tests -p test_codex_hooks.py -v

      - name: Run fast local hooks
        run: pre-commit run -a

      - name: Run heavy CI-only hooks
        run: pre-commit run -a --hook-stage manual
