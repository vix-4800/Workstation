[Settings]
# Theme and appearance
gtk-theme-name=catppuccin-mocha-lavender-standard+default
gtk-icon-theme-name=Adwaita
gtk-font-name=Cantarell 11
gtk-cursor-theme-name=catppuccin-mocha-lavender-cursors
gtk-cursor-theme-size=24

# Dark mode
gtk-application-prefer-dark-theme=1

# Visual effects
gtk-enable-animations=1
gtk-primary-button-warps-slider=0

# Menu and toolbar
gtk-menu-images=1
gtk-button-images=1
gtk-decoration-layout=menu:minimize,maximize,close
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR

# Font rendering (Wayland optimization)
gtk-hint-font-metrics=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintfull
gtk-xft-rgba=rgb

# Dialogs
gtk-dialogs-use-header=1
gtk-shell-shows-app-menu=0
gtk-shell-shows-menubar=0
gtk-shell-shows-desktop=0

# Accessibility and UX
gtk-enable-primary-paste=0
gtk-recent-files-enabled=1
gtk-recent-files-max-age=30
gtk-keynav-use-caret=0
