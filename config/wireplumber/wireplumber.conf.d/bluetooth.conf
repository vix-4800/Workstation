# WirePlumber optimizations for Bluetooth audio
# Prevents audio glitches when using EasyEffects with Bluetooth

monitor.bluez.properties = {
    # Enable higher quality codecs
    bluez5.enable-sbc-xq = true
    bluez5.enable-msbc = true
    bluez5.enable-hw-volume = true

    # Reduce latency for A2DP
    bluez5.a2dp.ldac.quality = "hq"
    bluez5.default.rate = 48000
    bluez5.default.channels = 2
}

# Node-specific settings for Bluetooth devices
monitor.bluez.rules = [
    {
        matches = [
            {
                # Match all Bluetooth A2DP sinks
                device.name = "~bluez_card.*"
            }
        ]
        actions = {
            update-props = {
                # Lower buffer size for BT
                api.bluez5.a2dp-buffer-size = 960

                # Disable pause-on-idle to prevent reconnection issues
                node.pause-on-idle = false

                # Set quantum specifically for BT devices
                node.latency = "256/48000"
            }
        }
    }
]
