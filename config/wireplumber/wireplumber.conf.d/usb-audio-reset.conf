# WirePlumber rules to reset USB audio device state on startup
# Fixes volume issues after dual-boot with Windows

monitor.alsa.rules = [
    {
        matches = [
            {
                # Match Redmi USB speaker
                device.name = "~alsa_card.usb-MV-SILICON_Redmi.*"
            }
        ]
        actions = {
            update-props = {
                # Force software volume control
                # This ensures consistent volume regardless of hardware state
                api.alsa.soft-mixer = true

                # Set initial volume to maximum on device init
                api.alsa.headroom = 0

                # Ignore hardware mixer state from previous OS
                api.alsa.ignore-dB = true
            }
        }
    },
    {
        matches = [
            {
                # Match all USB audio cards
                device.bus = "usb"
                media.class = "Audio/Sink"
            }
        ]
        actions = {
            update-props = {
                # Force volume reset for USB devices
                api.alsa.soft-mixer = true
                node.pause-on-idle = false
            }
        }
    }
]
