[main]
modules=media-background-module;userinfo-module;playerctl-module

time-format=%H:%M
date-format=%A, %d %B %Y

idle-hide=true
idle-timeout=30
start-hidden=false

[userinfo]
round-image=true
horizontal-layout=false
under-clock=false

[playerctl]
position=bottom-center
art-size=0

[media-background]
opacity=0.85
darken=true
darken-amount=0.4
background-color=#1e1e2e

