[main]
; modules=media-background-module;userinfo-module;playerctl-module;network-module;battery-module
modules=userinfo-module;playerctl-module;network-module;battery-module

time-format=%I:%M %p
date-format=%A, %d %B %Y

idle-hide=true
idle-timeout=30
start-hidden=false

[userinfo]
round-image=true
horizontal-layout=false
under-clock=false

[playerctl]
position=bottom-center
art-size=0

[media-background]
opacity=0.45
darken=true
darken-amount=0.5
player-filter=spotify

