# Appearance configuration

# ===== Visual Effects =====
# Gaps and borders
smart_gaps on
smart_borders on
gaps inner 10
gaps outer 0
default_border pixel 2
default_floating_border pixel 3

# Corner radius for windows
corner_radius 8

# Blur effects for modern look
blur enable
blur_passes 2
blur_radius 5

# Shadows for floating windows
shadows enable
shadow_blur_radius 10
shadow_color #00000080

# ===== Mouse & Focus =====
focus_follows_mouse yes
mouse_warping output
focus_on_window_activation smart

# ===== Cursor Theme =====
seat seat0 xcursor_theme catppuccin-mocha-lavender-cursors 24
