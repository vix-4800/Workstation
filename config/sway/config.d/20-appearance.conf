# Appearance configuration

# Gaps and borders
smart_gaps on
smart_borders on
gaps inner 10
gaps outer 0
default_border pixel 2
default_floating_border pixel 3

# Corner radius for windows
corner_radius 8

# Focus follows mouse with delay
focus_follows_mouse yes
mouse_warping output

# Blur effects for modern look
blur enable
blur_passes 2
blur_radius 5

# Shadows for floating windows
shadows enable
shadow_blur_radius 10
shadow_color #00000080

client.focused #61afef #61afef #0f111a #61afef
client.focused_inactive #3e4452 #3e4452 #abb2bf #3e4452
client.unfocused #1e222a #1e222a #abb2bf #1e222a
client.urgent #e06c75 #e06c75 #0f111a #e06c75
client.placeholder #282c34 #282c34 #abb2bf #282c34

# Wallpaper (managed by waypaper)
# output * bg ~/Pictures/Wallpapers/city-horizon.jpg fill

seat seat0 xcursor_theme catppuccin-mocha-lavender-cursors 24
