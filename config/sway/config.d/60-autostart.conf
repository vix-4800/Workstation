# Autostart configuration

# ===== System Services =====
exec $notification_daemon
exec $osd_server
exec wl-paste --watch $clipboard_manager store
exec udiskie --tray
exec $wallpaper_manager --restore

# ===== Startup Applications =====
# Launch Firefox on workspace 2 at startup
exec --no-startup-id swaymsg 'workspace number 2; exec firefox'
