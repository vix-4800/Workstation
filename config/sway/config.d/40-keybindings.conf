# Key bindings configuration

# ===== Basic Actions =====
bindsym $mod+Return exec $term
bindsym $mod+q kill
bindsym $mod+Space exec $menu
bindsym $mod+l exec $lock -f
bindsym $mod+Shift+c reload

# Drag floating windows by holding down $mod and left mouse button.
# Resize them with right mouse button + $mod.
floating_modifier $mod normal

# ===== Clipboard Management =====
bindsym $mod+v exec $menu_clip
bindsym $mod+Shift+v exec $clipboard_manager wipe && notify-send "Clipboard history cleared"

# ===== Notifications =====
bindsym $mod+Shift+n exec $notification_client -t -sw

# ===== System Utilities =====
bindsym $mod+Shift+b exec pkill -SIGUSR2 waybar
bindsym $mod+Shift+q exec wlogout
bindsym $mod+Shift+D exec wdisplays
bindsym $mod+Shift+F exec $file_manager
bindsym $mod+w exec $wallpaper_manager

# Desktop context menu (quick actions)
bindsym $mod+Shift+a exec ~/.config/waybar/scripts/desktop-menu

# ===== Focus Movement =====
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# ===== Window Movement =====
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# ===== Volume Controls =====
bindsym XF86AudioRaiseVolume exec $volume_control --output-volume raise --max-volume 100
bindsym XF86AudioLowerVolume exec $volume_control --output-volume lower --max-volume 100
bindsym XF86AudioMute exec $volume_control --output-volume mute-toggle
bindsym XF86AudioMicMute exec $volume_control --input-volume mute-toggle

# ===== Media Controls =====
bindsym XF86AudioPlay exec $media_control play-pause && notify-send "Media" "$($media_control status)" -t 1000
bindsym XF86AudioNext exec $media_control next && notify-send "Media" "$($media_control metadata --format '{{ title }}')" -t 2000
bindsym XF86AudioPrev exec $media_control previous && notify-send "Media" "$($media_control metadata --format '{{ title }}')" -t 2000

# ===== Brightness Controls =====
bindsym XF86MonBrightnessUp exec $brightness_control set +5%
bindsym XF86MonBrightnessDown exec $brightness_control set 5%-

# ===== Screenshot Bindings =====
bindsym Print exec mkdir -p $screenshot_dir && $screenshot_tool $screenshot_dir/screenshot-$(date +%Y-%m-%d-%H-%M-%S).png && notify-send "Screenshot" "Full screen saved" -t 2000
bindsym $mod+Print exec mkdir -p $screenshot_dir && $screenshot_tool -g "$($screenshot_selector)" $screenshot_dir/screenshot-$(date +%Y-%m-%d-%H-%M-%S).png && notify-send "Screenshot" "Area saved" -t 2000
bindsym $mod+Shift+Print exec $screenshot_tool -g "$($screenshot_selector)" - | wl-copy && notify-send "Screenshot" "Copied to clipboard" -t 2000
bindsym Ctrl+Print exec $screenshot_tool -g "$($screenshot_selector)" - | $screenshot_editor -f - && notify-send "Screenshot" "Editing with Swappy" -t 2000

# ===== Special Keys =====
bindsym --release Caps_Lock exec $osd_client

# ===== Workspaces =====
# Switch to workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# ===== Layout & Window Management =====
# Fullscreen
bindsym $mod+f fullscreen

# Floating
bindsym $mod+Shift+space floating toggle

# Focus parent
bindsym $mod+a focus parent

# ===== Scratchpad =====
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# ===== Resize Mode =====
mode "resize" {
    # Vim-style keys
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px

    # Arrow keys
    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px

    # Return to default mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

bindsym $mod+r mode "resize"
