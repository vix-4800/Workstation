[General]
# Always enable Bluetooth adapters on boot
AutoEnable=true

# Disable discoverable timeout to stay discoverable
DiscoverableTimeout=0

# Allow pairing even if there are no agent registered
AlwaysPairable=true

# Enable experimental features for better compatibility
Experimental=true

# Enable kernel experimental features
KernelExperimental=true

# Keep Bluetooth in fast connectable mode for quick reconnections
FastConnectable=true

# Privacy settings - use device privacy mode for better compatibility
Privacy=device

[Policy]
# Auto-enable all controllers when they are found
AutoEnable=true

# Reconnect to previously paired devices automatically
ReconnectAttempts=7
ReconnectIntervals=1,2,4,8,16,32,64

# Delay before reconnecting after resume from suspend
ResumeDelay=2
