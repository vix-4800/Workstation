[Settings]
language = en
folder = ~/Pictures/Wallpapers
backend = swaybg
monitors = All
fill = fill
sort = name
number_of_columns = 3
show_path_in_tooltip = True
swww_transition_type = any
swww_transition_step = 63
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
wallpaper = ~/Pictures/Wallpapers/forest-1.jpg
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
zen_mode = False
post_command = notify-send "Wallpaper changed" -t 2000
mpvpaper_options =
use_xdg_state = False
stylesheet = ~/.config/waypaper/style.css
keybindings = ~/.config/waypaper/keybindings.ini
swaylock_config = ~/.config/swaylock/config
update_swaylock = True
