---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: roles/desktop/files/waypaper/config.ini
      - id: end-of-file-fixer
        exclude: roles/desktop/files/waypaper/config.ini
      - id: check-yaml
      - id: check-json
        exclude: roles/editor/files/code/User/(keybindings|tasks|settings)\.json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args:
          - --maxkb=500
      - id: mixed-line-ending
        args:
          - --fix=lf

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages:
          - manual

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        stages:
          - manual
        args:
          - --severity=warning

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        stages:
          - manual
        args:
          - --config-file
          - roles/development/files/tools/yaml/yamllint.yml

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        stages:
          - manual
        args:
          - --fix
          - --config
          - roles/development/files/tools/markdown/markdownlint/.markdownlint.jsonc
          - --ignore-path
          - roles/development/files/tools/markdown/markdownlint/.markdownlintignore

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages:
          - commit-msg
        additional_dependencies:
          - '@commitlint/config-conventional@19.0.0'
        args:
          - --config
          - roles/development/files/tools/commitlint/commitlint.config.js
