# Variables configuration

# Logo key. Use Mod1 for Alt.
set $mod Mod4

# Home row direction keys, like vim
set $left h
set $down j
set $up k
set $right l

# Applications
set $term alacritty --config-file "$HOME/.config/alacritty/alacritty.toml"
set $menu wofi --show run
set $lock swaylock --clock --image ~/Pictures/Wallpapers/forest-1.jpg --effect-blur 7x5 --grace 2 --fade-in 0.5 --indicator-idle-visible --effect-vignette 0.3:1 --indicator-radius 75 --indicator-thickness 5 --ring-color 61afef --separator-color 00000000 --key-hl-color 4163EC --hide-keyboard-layout --inside-clear-color 4163EC --line-clear-color 1741E8
