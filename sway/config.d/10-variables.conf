# Variables configuration

# Logo key. Use Mod1 for Alt.
set $mod Mod4

# Home row direction keys, like vim
set $left h
set $down j
set $up k
set $right l

# Applications
set $term alacritty --config-file "$HOME/.config/alacritty/alacritty.toml"
set $menu wofi --show=drun --allow-images --allow-markup
set $lock swaylock --clock --image "$HOME/Pictures/Wallpapers/forest-1.jpg" --effect-blur 7x5 --fade-in 0.5 --effect-vignette 0.3:1 --indicator-radius 75 --indicator-thickness 5 --ring-color 61afef --separator-color 00000000 --key-hl-color 4163EC --hide-keyboard-layout --inside-clear-color 4163EC --line-clear-color 1741E8
set $menu_clip cliphist list | wofi --dmenu --prompt="📋 Clipboard" --width=45% --height=30% --location=center | cliphist decode | wl-copy
