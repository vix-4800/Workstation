# Window rules and assignments

# Workspace assignments
assign [app_id="firefox"] workspace number 2
assign [app_id="code-oss"] workspace number 3
assign [class="discord"] workspace number 4
assign [class="TelegramDesktop"] workspace number 4
assign [app_id="Spotify"] workspace number 5

# Floating windows
for_window [app_id="pavucontrol"] floating enable, resize set 800 600
for_window [app_id="blueman-manager"] floating enable, resize set 600 400
for_window [app_id="nm-connection-editor"] floating enable, resize set 600 400
for_window [title="File Upload"] floating enable
for_window [title="Save File"] floating enable
for_window [title="Open File"] floating enable
for_window [app_id="thunar" title="File Operation Progress"] floating enable

# Picture-in-picture
for_window [title="Picture-in-Picture"] floating enable, sticky enable, resize set 400 225, move position 1200 50

# Applications startup behavior
for_window [app_id="firefox"] opacity 1
for_window [app_id="alacritty"] opacity 0.95

# Urgent workspace switching
for_window [urgent="latest"] focus

# No focus stealing
no_focus [title=".*"]
