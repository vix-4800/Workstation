# Key bindings configuration

# Basic bindings
bindsym $mod+Return exec $term
bindsym $mod+q kill
bindsym $mod+Space exec $menu
bindsym $mod+l exec $lock -f
bindsym $mod+v exec $menu_clip
bindsym $mod+Shift+v exec cliphist wipe && notify-send "Clipboard history cleared"
bindsym $mod+Shift+n exec swaync-client -t -sw

# Sway control
bindsym $mod+Shift+c reload

# System utilities
# bindsym $mod+Shift+N exec nm-connection-editor
bindsym $mod+Shift+b exec pkill -SIGUSR2 waybar
bindsym $mod+Shift+q exec wlogout
bindsym $mod+Shift+D exec wdisplays
bindsym $mod+Shift+F exec thunar

# Drag floating windows by holding down $mod and left mouse button.
# Resize them with right mouse button + $mod.
floating_modifier $mod normal

# Focus movement
# bindsym $mod+$left focus left
# bindsym $mod+$down focus down
# bindsym $mod+$up focus up
# bindsym $mod+$right focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Window movement
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# Volume controls
bindsym XF86AudioRaiseVolume exec swayosd-client --output-volume raise --max-volume 100
bindsym XF86AudioLowerVolume exec swayosd-client --output-volume lower --max-volume 100
bindsym XF86AudioMute exec swayosd-client --output-volume mute-toggle
bindsym XF86AudioMicMute exec swayosd-client --input-volume mute-toggle

# Media controls
bindsym XF86AudioPlay exec playerctl play-pause && notify-send "Media" "$(playerctl status)" -t 1000
bindsym XF86AudioNext exec playerctl next && notify-send "Media" "$(playerctl metadata --format '{{ title }}')" -t 2000
bindsym XF86AudioPrev exec playerctl previous && notify-send "Media" "$(playerctl metadata --format '{{ title }}')" -t 2000

# Brightness controls
bindsym XF86MonBrightnessUp exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# Screenshot bindings
bindsym Print exec mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d-%H-%M-%S).png && notify-send "Screenshot" "Full screen saved" -t 2000
bindsym $mod+Print exec mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d-%H-%M-%S).png && notify-send "Screenshot" "Area saved" -t 2000
bindsym $mod+Shift+Print exec grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Copied to clipboard" -t 2000
bindsym Ctrl+Print exec grim -g "$(slurp)" - | swappy -f - && notify-send "Screenshot" "Editing with Swappy" -t 2000

# Wallpaper switcher
bindsym $mod+w exec waypaper

# Desktop context menu (quick actions)
bindsym $mod+Shift+a exec ~/.config/waybar/scripts/desktop-menu

bindsym --release Caps_Lock exec swayosd-client
