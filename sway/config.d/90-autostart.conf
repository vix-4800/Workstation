# Autostart configuration
exec mako

# Workspace startup applications
exec_always --no-startup-id swaymsg 'workspace number 1; exec alacritty'
exec_always --no-startup-id swaymsg 'workspace number 2; exec firefox'

# Keyboard layout setup (fallback)
exec_always setxkbmap -layout us,ru -option 'grp:alt_shift_toggle'
