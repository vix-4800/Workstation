# Autostart configuration
exec mako
exec wl-paste --watch cliphist store

# Workspace startup applications
exec --no-startup-id swaymsg 'workspace number 1; exec alacritty'
exec --no-startup-id swaymsg 'workspace number 2; exec firefox'

# Keyboard layout setup (fallback)
exec_always setxkbmap -layout us,ru -option 'grp:alt_shift_toggle'
