---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Sync pacman database and install Python/sudo
      ansible.builtin.raw: pacman -Sy --noconfirm python sudo
      changed_when: true

    - name: Create molecule test user
      ansible.builtin.user:
        name: molecule
        state: present
        create_home: true
        shell: /bin/bash
        groups: wheel

    - name: Allow wheel group to sudo without password
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: ^%wheel
        line: '%wheel ALL=(ALL) NOPASSWD: ALL'
        validate: visudo -cf %s

    - name: Ensure config directories exist
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0755'
        owner: molecule
      loop:
        - /home/molecule/.config
        - /home/molecule/.local/bin
        - /home/molecule/Pictures
