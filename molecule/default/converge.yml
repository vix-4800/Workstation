---
# Converge playbook for molecule testing.
# Tests a container-safe subset of the workstation roles:
#   - base: package installation and config file symlinks
#   - shell: package installation and shell config symlinks
# Skips: systemd services, sysctl, reflector, AUR, hardware-specific roles.
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    ansible_user: molecule
    ansible_remote_tmp: /tmp/ansible-molecule
    # Reduced package lists — sufficient to prove pacman tasks work
    base_essential_packages:
      - git
      - curl
      - less
      - jq
      - tree
    base_cli_packages:
      - ripgrep
      - fd
      - fzf
      - bat
    shell_packages:
      - fish
      - tmux

  tasks:
    - name: Install base packages through the production role
      ansible.builtin.import_role:
        name: base
        tasks_from: packages

    - name: Deploy base configs through the production role
      ansible.builtin.import_role:
        name: base
        tasks_from: config

    - name: Install shell packages through the production role
      ansible.builtin.import_role:
        name: shell
        tasks_from: packages

    - name: Deploy shell configs through the production role
      ansible.builtin.import_role:
        name: shell
        tasks_from: config
