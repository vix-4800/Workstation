# Semgrep Configuration
# Global ruleset for PHP security and code quality scanning

rules:
  # ╭─────────────────────────────────────────────────────────╮
  # │ SQL Injection Prevention                                │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-sql-injection
    languages: [php]
    message: Potential SQL injection vulnerability detected. Use prepared statements or parameterized queries.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: mysql_query($SQL, ...)
          - pattern: mysqli_query(..., $SQL, ...)
          - pattern: $DB->query($SQL)
          - pattern: $PDO->query($SQL)
      - pattern-not: mysql_query("...", ...)
      - pattern-not: mysqli_query(..., "...", ...)
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"

  # ╭─────────────────────────────────────────────────────────╮
  # │ XSS Prevention                                          │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-xss-echo-var
    languages: [php]
    message: Unescaped variable output may lead to XSS. Use htmlspecialchars() or htmlentities().
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: echo $VAR
          - pattern: print $VAR
          - pattern: <?= $VAR ?>
      - pattern-not: echo htmlspecialchars(...)
      - pattern-not: echo htmlentities(...)
      - pattern-not: echo "..."
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting (XSS)"
      owasp: "A7: Cross-Site Scripting"

  # ╭─────────────────────────────────────────────────────────╮
  # │ Command Injection Prevention                            │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-command-injection
    languages: [php]
    message: Potential command injection. Validate and sanitize input before executing shell commands.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: exec($CMD)
          - pattern: shell_exec($CMD)
          - pattern: system($CMD)
          - pattern: passthru($CMD)
          - pattern: |
              `$CMD`
      - pattern-not: exec("...")
      - pattern-not: shell_exec("...")
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: "A1: Injection"

  # ╭─────────────────────────────────────────────────────────╮
  # │ File Inclusion Vulnerabilities                          │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-file-inclusion
    languages: [php]
    message: Potential file inclusion vulnerability. Validate file paths from user input.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: include($FILE)
          - pattern: require($FILE)
          - pattern: include_once($FILE)
          - pattern: require_once($FILE)
      - pattern-not: include("...")
      - pattern-not: require("...")
    metadata:
      category: security
      cwe: "CWE-98: PHP File Inclusion"
      owasp: "A5: Broken Access Control"

  # ╭─────────────────────────────────────────────────────────╮
  # │ Unsafe Deserialization                                  │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-unsafe-unserialize
    languages: [php]
    message: Unsafe deserialization of user input can lead to RCE. Use JSON or safer alternatives.
    severity: ERROR
    pattern: unserialize($INPUT)
    pattern-not: unserialize("...")
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A8: Insecure Deserialization"

  # ╭─────────────────────────────────────────────────────────╮
  # │ Weak Cryptography                                       │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-weak-crypto-md5
    languages: [php]
    message: MD5 is cryptographically weak. Use password_hash() for passwords or hash() with SHA-256+.
    severity: WARNING
    pattern-either:
      - pattern: md5($INPUT)
      - pattern: sha1($INPUT)
    metadata:
      category: security
      cwe: "CWE-327: Use of Broken Cryptography"

  # ╭─────────────────────────────────────────────────────────╮
  # │ Hardcoded Secrets                                       │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-hardcoded-secret
    languages: [php]
    message: Potential hardcoded secret detected. Use environment variables or secret management.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              $PASSWORD = "...";
          - pattern: |
              $API_KEY = "...";
          - pattern: |
              $SECRET = "...";
          - pattern: |
              $TOKEN = "...";
      - metavariable-pattern:
          metavariable: $VALUE
          pattern: |
            "..."
    metadata:
      category: security
      cwe: "CWE-798: Hardcoded Credentials"

  # ╭─────────────────────────────────────────────────────────╮
  # │ Path Traversal                                          │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-path-traversal
    languages: [php]
    message: Potential path traversal vulnerability. Validate and sanitize file paths.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: file_get_contents($PATH)
          - pattern: fopen($PATH, ...)
          - pattern: readfile($PATH)
          - pattern: file($PATH)
      - pattern-not: file_get_contents("...")
      - pattern-not: fopen("...", ...)
    metadata:
      category: security
      cwe: "CWE-22: Path Traversal"
      owasp: "A5: Broken Access Control"

  # ╭─────────────────────────────────────────────────────────╮
  # │ Code Quality - Type Juggling Issues                     │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-loose-comparison
    languages: [php]
    message: Use strict comparison (=== or !==) instead of loose comparison (== or !=).
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: |
              if ($X == $Y) { ... }
          - pattern: |
              if ($X != $Y) { ... }
      - pattern-not: |
          if ($X == true) { ... }
      - pattern-not: |
          if ($X == false) { ... }
    metadata:
      category: best-practice

  # ╭─────────────────────────────────────────────────────────╮
  # │ Eval Usage                                              │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-eval-usage
    languages: [php]
    message: Avoid using eval(). It can execute arbitrary code and is a security risk.
    severity: ERROR
    pattern: eval($CODE)
    metadata:
      category: security
      cwe: "CWE-95: Eval Injection"

  # ╭─────────────────────────────────────────────────────────╮
  # │ Debug Functions in Production                           │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-debug-functions
    languages: [php]
    message: Debug function detected. Remove before deploying to production.
    severity: WARNING
    pattern-either:
      - pattern: var_dump(...)
      - pattern: print_r(...)
      - pattern: dd(...)
      - pattern: dump(...)
    metadata:
      category: best-practice

  # ╭─────────────────────────────────────────────────────────╮
  # │ Open Redirect                                           │
  # ╰─────────────────────────────────────────────────────────╯
  - id: php-open-redirect
    languages: [php]
    message: Potential open redirect vulnerability. Validate redirect URLs against whitelist.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: header("Location:" . $URL)
          - pattern: header("Location:$URL")
      - pattern-not: header("Location:...")
    metadata:
      category: security
      cwe: "CWE-601: Open Redirect"
      owasp: "A5: Broken Access Control"
