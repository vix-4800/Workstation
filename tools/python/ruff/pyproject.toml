[tool.ruff]
# Совместимость с Black
line-length = 120
target-version = "py311"

# Индентация
indent-width = 4

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "migrations",
    ".pytest_cache",
    ".mypy_cache",
    "*.egg-info",
]

[tool.ruff.lint]
# Включаем правила (замена flake8, isort, и т.д.)
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (сортировка импортов)
    "N",      # pep8-naming
    "UP",     # pyupgrade (автоапгрейд синтаксиса)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "DTZ",    # flake8-datetimez
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "TRY",    # tryceratops
]

# Игнорируем правила (совместимость с вашим flake8)
ignore = [
    "E302",   # Expected 2 blank lines
    "E305",   # Expected 2 blank lines after function/class
    "E402",   # Module level import not at top of file
    "W391",   # Blank line at end of file
    "S101",   # Use of assert detected (для тестов)
    "TRY003", # Avoid specifying long messages outside exception class
    "EM101",  # Exception must not use a string literal
    "EM102",  # Exception must not use an f-string literal
    "COM812", # Missing trailing comma (конфликтует с formatter)
    "ISC001", # Implicitly concatenated string literals (конфликтует с formatter)
]

# Разрешаем автофикс для этих правил
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Форматирование (замена Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
# Настройки сортировки импортов
combine-as-imports = true
force-wrap-aliases = true
known-first-party = []

[tool.ruff.lint.mccabe]
# Максимальная сложность функций
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# Docstring conventions
convention = "google"

[tool.ruff.lint.pylint]
# Pylint-specific settings
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

# Настройки для mypy (type checking)
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
exclude = "^tests/"
