---
# Main playbook - Full system setup
# Run this to set up a complete Arch Linux system with Sway

# - name: 'Update system packages'
#   hosts: localhost
#   connection: local
#   gather_facts: false
#   become: true
#   tasks:
#     - name: 'Update all packages'
#       community.general.pacman:
#         update_cache: true
#         upgrade: true

- name: 'Install essential packages'
  import_playbook: essential.yml
- name: 'Configure CPU microcode'
  import_playbook: cpu-microcode.yml
- name: 'Install GPU drivers'
  import_playbook: gpu-drivers.yml
- name: 'Install AUR helper (yay)'
  import_playbook: yay.yml
- name: 'Setup dotfiles'
  import_playbook: dotfiles.yml
- name: 'Configure shell (Fish)'
  import_playbook: shell.yml
- name: 'Install code editors'
  import_playbook: editors.yml
- name: 'Configure networking'
  import_playbook: network.yml
- name: 'Setup audio system'
  import_playbook: audio.yml
- name: 'Install Sway compositor'
  import_playbook: sway.yml
- name: 'Configure Plymouth boot splash'
  import_playbook: plymouth.yml
- name: 'Setup display manager (Greetd)'
  import_playbook: display-managers/greetd.yml
- name: 'Install Docker'
  import_playbook: docker.yml
- name: 'Configure Bluetooth'
  import_playbook: bluetooth.yml
- name: 'Setup firewall'
  import_playbook: firewall.yml
- name: 'Configure environment variables'
  import_playbook: environment.yml
- name: 'Setup locale settings'
  import_playbook: locale.yml
- name: 'Configure hostname'
  import_playbook: hostname.yml
- name: 'Install multimedia apps'
  import_playbook: multimedia.yml
- name: 'Install development tools'
  import_playbook: development.yml
- name: 'Install optional applications'
  import_playbook: optional-apps.yml

# Applications
- name: 'Install Spicetify for Spotify'
  import_playbook: apps/spicetify.yml
- name: 'Install Waypaper wallpaper selector'
  import_playbook: apps/waypaper.yml

# Appearance
- name: 'Install fonts'
  import_playbook: fonts.yml
- name: 'Install cursor themes'
  import_playbook: cursors.yml
- name: 'Install icon themes'
  import_playbook: icons.yml

- name: 'Final system cleanup'
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: 'Clean package cache'
      ansible.builtin.command:
        cmd: pacman -Sc --noconfirm
      changed_when: false

    - name: 'Setup complete message'
      ansible.builtin.debug:
        msg: |
          ===================================
          System setup complete!
          ===================================

          Important next steps:
          1. REBOOT your system: sudo reboot
          2. Log out and back in for group changes (docker, wheel) to take effect
          3. Fish is now your default shell
          4. Configure GitHub CLI: gh auth login
          5. All dotfiles symlinks have been applied
          6. Check SwayFX config at ~/.config/sway/config

          Installed:
          - SwayFX + Swaylock Effects + wlogout
          - Greetd + ReGreet (display manager)
          - Plymouth boot splash screen
          - Visual Studio Code
          - Spotify, Discord, Telegram, VLC, Obsidian
          - Docker (you're in docker group now)
          - UFW firewall, Bluetooth
          - Development tools: PHP, Python, Go
          - Fish shell with Fisher
          - Modern CLI tools: eza, bat, ripgrep, fd
          - All config symlinks from dotfiles

          ===================================
