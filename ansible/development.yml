- name: 'Install development tools'
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tasks:
    - name: 'Install development packages'
      community.general.pacman:
        name:
          - php
          - php-gd
          - php-intl
          - composer
          - python-pip
          - python-pipx
          - go
        state: present

    - name: 'Install Python development tools via pipx'
      become: false
      community.general.pipx:
        name: "{{ item }}"
        state: present
      loop:
        - pre-commit
        - ruff
        - mypy

    - name: 'Configure Composer global plugins'
      become: false
      ansible.builtin.command:
        cmd: composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
      changed_when: false

    - name: 'Install PHP development packages globally via Composer'
      become: false
      ansible.builtin.command:
        cmd: >
          composer global require --no-interaction
          phpstan/phpstan
          phpstan/extension-installer
          phpstan/phpstan-strict-rules
          phpstan/phpstan-deprecation-rules
          friendsofphp/php-cs-fixer
          rector/rector
          driftingly/rector-laravel
          phpmd/phpmd
          squizlabs/php_codesniffer
          slevomat/coding-standard
          devstrict/phpcs:dev-main
      register: composer_install
      changed_when: "'Nothing to install' not in composer_install.stdout"
      ignore_errors: true

    - name: 'Ensure Composer global bin directory is in PATH'
      become: false
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.profile"
        line: 'export PATH="$HOME/.config/composer/vendor/bin:$PATH"'
        create: true
        mode: '0644'

    - name: 'Install general linters and code quality tools'
      community.general.pacman:
        name:
          # Shell linting
          - shellcheck

          # YAML/JSON
          - yamllint

          # Markdown
          - markdownlint-cli
        state: present

    - name: 'Install Node.js-based development tools globally'
      become: false
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: present
      loop:
        # Commit linting
        - '@commitlint/cli'
        - '@commitlint/config-conventional'

        # ESLint (globally for CLI usage)
        - 'eslint'
      failed_when: false

    - name: 'Install ESLint config dependencies locally'
      become: false
      community.general.npm:
        path: "{{ playbook_dir }}/../tools/javascript/eslint"
        state: present
      failed_when: false
