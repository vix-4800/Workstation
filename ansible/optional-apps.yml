- name: 'Install applications'
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: 'Install applications'
      community.general.pacman:
        name:
          - firefox
          - discord
          - telegram-desktop
          - vlc
          - obsidian
          - wireguard-tools
          - github-cli
          - flatpak
          - zathura
          - zathura-pdf-mupdf
          - thunar
          - feh
          - trash-cli
        state: present

    - name: 'Check if yay is installed'
      ansible.builtin.command:
        cmd: which yay
      register: yay_check
      changed_when: false
      failed_when: false

    - name: 'Install AUR applications'
      become: false
      kewlfft.aur.aur:
        use: yay
        name:
          - spotify
          - catppuccin-gtk-theme-mocha
          - wdisplays
          - waypaper
          - swappy
          - better-control-git
          - swayosd
          - batsignal
          - waybar-module-pacman-updates-git
          - auto-cpufreq
        state: present
      when: yay_check.rc == 0

    - name: 'Enable and start arch-update timer'
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      when: yay_check.rc == 0
      loop:
        - auto-cpufreq
