---
- name: 'Configure system hostname'
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tasks:
    - name: 'Get current hostname'
      ansible.builtin.command:
        cmd: hostnamectl hostname
      register: current_hostname
      changed_when: false

    - name: 'Display current hostname'
      ansible.builtin.debug:
        msg: "Current hostname: {{ current_hostname.stdout }}"

    - name: 'Prompt for new hostname'
      ansible.builtin.pause:
        prompt: |
          Current hostname is '{{ current_hostname.stdout }}'.
          Enter new hostname (or press Enter to skip)
      register: hostname_input
      when: current_hostname.stdout == 'localhost' or current_hostname.stdout == ''

    - name: 'Set hostname variable'
      ansible.builtin.set_fact:
        new_hostname: "{{ hostname_input.user_input | trim }}"
      when:
        - hostname_input.user_input is defined
        - hostname_input.user_input | trim | length > 0

    - name: 'Set hostname in /etc/hostname'
      ansible.builtin.copy:
        content: "{{ new_hostname }}\n"
        dest: /etc/hostname
        owner: root
        group: root
        mode: '0644'
      when: new_hostname is defined

    - name: 'Update /etc/hosts with new hostname'
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1\t{{ new_hostname }}"
        state: present
        create: true
      when: new_hostname is defined

    - name: 'Apply hostname using hostnamectl'
      ansible.builtin.command:
        cmd: "hostnamectl set-hostname {{ new_hostname }}"
      when: new_hostname is defined
      changed_when: true

    - name: 'Display success message'
      ansible.builtin.debug:
        msg: "Hostname successfully changed to '{{ new_hostname }}'"
      when: new_hostname is defined

    - name: 'Display skip message'
      ansible.builtin.debug:
        msg: "Hostname configuration skipped (current: {{ current_hostname.stdout }})"
      when: new_hostname is not defined
