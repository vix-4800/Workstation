- name: 'Install and configure Bluetooth'
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: 'Install Bluetooth packages'
      community.general.pacman:
        name:
          - bluez
          - bluez-utils
          - blueman
        state: present

    - name: 'Create /etc/bluetooth directory'
      ansible.builtin.file:
        path: /etc/bluetooth
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: 'Deploy optimized Bluetooth configuration'
      ansible.builtin.copy:
        src: ../config/bluetooth/main.conf
        dest: /etc/bluetooth/main.conf
        mode: '0644'
        owner: root
        group: root
        backup: true
      notify: restart bluetooth

    - name: 'Enable and start Bluetooth service'
      ansible.builtin.systemd:
        name: bluetooth
        enabled: true
        state: started

  handlers:
    - name: restart bluetooth
      ansible.builtin.systemd:
        name: bluetooth
        state: restarted
