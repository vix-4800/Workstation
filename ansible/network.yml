- name: 'Network setup'
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: 'Install network packages'
      community.general.pacman:
        name:
          - networkmanager
          - network-manager-applet
          - nm-connection-editor
          - openssh
          - openssl
        state: present

    - name: 'Enable and start NetworkManager service'
      ansible.builtin.systemd:
        name: NetworkManager
        enabled: true
        state: started

    - name: 'Check if yay is installed'
      ansible.builtin.command:
        cmd: which yay
      register: yay_check
      changed_when: false
      failed_when: false

    - name: 'Install NetworkManager dmenu from AUR'
      kewlfft.aur.aur:
        use: yay
        name:
          - networkmanager-dmenu-git
        state: present
      when: yay_check.rc == 0
      become: true
      become_user: aur_builder
