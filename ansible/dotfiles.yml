- name: 'Apply dotfiles symlinks'
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    repo_root: "{{ playbook_dir | dirname }}"
    conf_map: "{{ repo_root }}/dotfiles.json"
  tasks:
    - name: 'Check if workstation script exists'
      ansible.builtin.stat:
        path: "{{ repo_root }}/bin/workstation"
      register: workstation_script

    - name: 'Fail if workstation script not found'
      ansible.builtin.fail:
        msg: 'Workstation script not found at {{ repo_root }}/bin/workstation'
      when: not workstation_script.stat.exists

    - name: 'Make workstation script executable'
      ansible.builtin.file:
        path: "{{ repo_root }}/bin/workstation"
        mode: '0755'

    - name: 'Check if confmap exists'
      ansible.builtin.stat:
        path: "{{ conf_map }}"
      register: confmap_file

    - name: 'Fail if confmap not found'
      ansible.builtin.fail:
        msg: 'Config map not found at {{ conf_map }}'
      when: not confmap_file.stat.exists

    - name: 'Apply dotfiles symlinks'
      ansible.builtin.command:
        cmd: "{{ repo_root }}/bin/workstation link"
      register: dotfiles_output
      changed_when: "'Linked:' in dotfiles_output.stdout"

    - name: 'Show dotfiles output'
      ansible.builtin.debug:
        var: dotfiles_output.stdout_lines
      when: dotfiles_output.stdout_lines is defined and dotfiles_output.stdout_lines | length > 0

    - name: 'Check dotfiles status'
      ansible.builtin.command:
        cmd: "{{ repo_root }}/bin/workstation status"
      register: dotfiles_status
      changed_when: false

    - name: 'Display dotfiles status'
      ansible.builtin.debug:
        msg: "{{ dotfiles_status.stdout_lines }}"
      when: dotfiles_status.stdout_lines is defined and dotfiles_status.stdout_lines | length > 0
