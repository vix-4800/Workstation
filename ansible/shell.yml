- name: 'Install shell and terminal'
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: 'Install shell and terminal'
      community.general.pacman:
        name:
          - fish
          - alacritty
          - tmux
        state: present

    - name: 'Set Fish as default shell for user'
      become: false
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/fish
      when: ansible_user_id is defined

    - name: 'Create Fish config directory'
      become: false
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/fish"
        state: directory
        mode: '0755'

    - name: 'Install Fisher plugin manager'
      become: false
      ansible.builtin.shell:
        cmd: fish -c "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher"
        creates: "{{ ansible_env.HOME }}/.config/fish/functions/fisher.fish"
      ignore_errors: true
