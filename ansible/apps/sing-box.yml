---
- name: "Install and configure sing-box"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Check if yay is installed"
      ansible.builtin.command:
        cmd: which yay
      register: yay_check
      changed_when: false
      failed_when: false

    - name: "Install sing-box from AUR"
      kewlfft.aur.aur:
        use: yay
        name:
          - sing-box
        state: present
      when: yay_check.rc == 0
      become: true
      become_user: aur_builder

    - name: "Create /etc/sing-box directory"
      become: true
      ansible.builtin.file:
        path: /etc/sing-box
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: "Enable IP forwarding for TUN mode (persistent)"
      become: true
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-sing-box.conf
        content: |
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
        mode: "0644"

    - name: "Apply sysctl settings immediately"
      become: true
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: "Add sudoers rules for passwordless sing-box management"
      become: true
      ansible.builtin.copy:
        dest: /etc/sudoers.d/sing-box
        content: |
          # Allow wheel group to manage sing-box service and config without password
          %wheel ALL=(ALL) NOPASSWD: /usr/bin/systemctl start sing-box
          %wheel ALL=(ALL) NOPASSWD: /usr/bin/systemctl stop sing-box
          %wheel ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart sing-box
          %wheel ALL=(ALL) NOPASSWD: /usr/bin/tee /etc/sing-box/config.json
        mode: "0440"
        validate: "visudo -cf %s"

    - name: "Ensure sing-box is disabled at boot (vpn script controls it)"
      become: true
      ansible.builtin.systemd:
        name: sing-box
        enabled: false
        daemon_reload: true
      ignore_errors: true
