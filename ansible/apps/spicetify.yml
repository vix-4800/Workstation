---
- name: 'Install and configure Spicetify'
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: 'Check if yay is installed'
      ansible.builtin.command:
        cmd: which yay
      register: yay_check
      changed_when: false
      failed_when: false

    - name: 'Install Spicetify CLI from AUR'
      kewlfft.aur.aur:
        use: yay
        name:
          - spicetify-cli
        state: present
      when: yay_check.rc == 0
      become: yes
      become_user: aur_builder

    - name: 'Check if Spotify is installed'
      ansible.builtin.command:
        cmd: pacman -Qi spotify
      register: spotify_check
      changed_when: false
      failed_when: false

    - name: 'Set Spotify directory permissions'
      ansible.builtin.file:
        path: /opt/spotify
        mode: 'a+wr'
        recurse: false
      when: spotify_check.rc == 0

    - name: 'Set Spotify Apps directory permissions'
      ansible.builtin.file:
        path: /opt/spotify/Apps
        mode: 'a+wr'
        recurse: true
      when: spotify_check.rc == 0

    - name: 'Run Spicetify backup and apply'
      become: false
      ansible.builtin.command:
        cmd: spicetify backup apply
      register: spicetify_backup
      changed_when: "'Spotify is spiced up!' in spicetify_backup.stdout or 'Success' in spicetify_backup.stdout"
      failed_when: false
      when: spotify_check.rc == 0

    - name: 'Check if Spicetify Marketplace is already installed'
      become: false
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.config/spicetify/CustomApps/marketplace"
      register: marketplace_check

    - name: 'Install Spicetify Marketplace'
      become: false
      ansible.builtin.shell:
        cmd: curl -fsSL https://raw.githubusercontent.com/spicetify/spicetify-marketplace/main/resources/install.sh | sh
      when: not marketplace_check.stat.exists
      register: marketplace_install
      changed_when: marketplace_install.rc == 0
