# Ansible configuration for Arch setup playbooks

[defaults]
# Don't gather facts by default (we set gather_facts: false in playbooks)
gathering = explicit

# Increase timeout for slow operations
timeout = 30

# Use local connection for localhost
transport = local

# Show diff when files change
diff_always = true

# Colorize output
force_color = true

# Use single column stdout callback
stdout_callback = yaml

# Retry files directory
retry_files_enabled = false

# Host key checking (usually ok for localhost)
host_key_checking = false

[privilege_escalation]
# Become method for privilege escalation
become = true
become_method = sudo
become_user = root
become_ask_pass = false

[inventory]
# Enable localhost implicit inventory
localhost_warning = false

[ssh_connection]
# SSH pipelining for better performance
pipelining = true
