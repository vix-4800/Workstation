---
- name: 'Configure Plymouth boot splash screen'
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    plymouth_theme: catppuccin-mocha
    grub_cmdline_params: 'loglevel=3 quiet splash rd.udev.log_priority=3 vt.global_cursor_default=0'
    mkinitcpio_hooks: 'base udev plymouth autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck'

  tasks:
    - name: 'Check if yay is installed'
      ansible.builtin.command:
        cmd: which yay
      register: yay_check
      changed_when: false
      failed_when: false

    - name: 'Install Plymouth from AUR'
      become: false
      kewlfft.aur.aur:
        use: yay
        name: plymouth
        state: present
      when: yay_check.rc == 0

    - name: 'Ensure Plymouth configuration directory exists'
      ansible.builtin.file:
        path: /etc/plymouth
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 'Copy themes'
      ansible.builtin.copy:
        src: ~/.config/themes/plymouth/
        dest: /usr/share/plymouth/themes/
        owner: root
        group: root
        mode: '0644'

    - name: 'Configure Plymouth theme'
      ansible.builtin.ini_file:
        path: /etc/plymouth/plymouthd.conf
        section: Daemon
        option: Theme
        value: '{{ plymouth_theme }}'
        create: yes
        mode: '0644'
      notify:
        - rebuild initramfs
        - update grub

    - name: 'Set Plymouth default theme'
      ansible.builtin.command:
        cmd: plymouth-set-default-theme -R {{ plymouth_theme }}
      register: plymouth_theme_result
      changed_when: plymouth_theme_result.rc == 0
      failed_when: false
      when: yay_check.rc == 0

    - name: 'Update mkinitcpio.conf HOOKS for Plymouth'
      ansible.builtin.lineinfile:
        path: /etc/mkinitcpio.conf
        regexp: '^HOOKS='
        line: 'HOOKS=({{ mkinitcpio_hooks }})'
        backup: yes
      notify: rebuild initramfs

    - name: 'Update GRUB cmdline parameters for Plymouth'
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ grub_cmdline_params }}"'
        backup: yes
      notify: update grub

  handlers:
    - name: rebuild initramfs
      ansible.builtin.command:
        cmd: mkinitcpio -P

    - name: update grub
      ansible.builtin.command:
        cmd: grub-mkconfig -o /boot/grub/grub.cfg
