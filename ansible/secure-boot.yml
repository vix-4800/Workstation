---
# Secure Boot configuration with sbctl
# NOTE: This playbook prepares the system for Secure Boot but requires manual BIOS steps:
# 1. Run this playbook
# 2. Reboot into BIOS and clear Secure Boot keys (enter Setup Mode)
# 3. Boot back to Linux and run: sudo sbctl enroll-keys --microsoft
# 4. Reboot into BIOS and enable Secure Boot
# 5. Verify with: sbctl status

- name: "Configure Secure Boot with sbctl"
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: "Install sbctl package"
      community.general.pacman:
        name:
          - sbctl
        state: present
        update_cache: false

    - name: "Check if Secure Boot keys already exist"
      ansible.builtin.stat:
        path: /usr/share/secureboot/keys/PK/PK.key
      register: secureboot_keys

    - name: "Create Secure Boot keys"
      ansible.builtin.command:
        cmd: sbctl create-keys
      when: not secureboot_keys.stat.exists
      changed_when: true

    - name: "Get list of files to sign"
      ansible.builtin.command:
        cmd: sbctl verify
      register: sbctl_verify_output
      changed_when: false
      failed_when: false

    - name: "Sign bootloader (bootx64.efi)"
      ansible.builtin.command:
        cmd: sbctl sign -s /efi/EFI/Boot/bootx64.efi
      when: "'/efi/EFI/Boot/bootx64.efi is not signed' in sbctl_verify_output.stdout"
      changed_when: true

    - name: "Sign GRUB (grubx64.efi)"
      ansible.builtin.command:
        cmd: sbctl sign -s /efi/EFI/GRUB/grubx64.efi
      when: "'/efi/EFI/GRUB/grubx64.efi is not signed' in sbctl_verify_output.stdout"
      changed_when: true

    - name: "Sign Linux kernel"
      ansible.builtin.command:
        cmd: sbctl sign -s /boot/vmlinuz-linux
      when: "'/boot/vmlinuz-linux is not signed' in sbctl_verify_output.stdout"
      changed_when: true

    - name: "Enable sbctl pacman hook"
      ansible.builtin.file:
        path: /etc/pacman.d/hooks
        state: directory
        mode: "0755"

    - name: "Check current Secure Boot status"
      ansible.builtin.command:
        cmd: sbctl status
      register: sbctl_status
      changed_when: false
      failed_when: false

    - name: "Display Secure Boot configuration status"
      ansible.builtin.debug:
        msg: |
          ===================================
          Secure Boot Configuration Status
          ===================================

          {{ sbctl_status.stdout }}

          ===================================
          MANUAL STEPS REQUIRED:
          ===================================

          1. Reboot your system
          2. Enter BIOS/UEFI (usually Del, F2, or F12 during boot)
          3. Find Secure Boot settings
          4. Clear/Delete existing Secure Boot keys (enter Setup Mode)
          5. Save and reboot
          6. After booting to Linux, run:
             sudo sbctl enroll-keys --microsoft
          7. Reboot again and enter BIOS
          8. Enable Secure Boot
          9. Save and boot normally
          10. Verify with: sbctl status

          Your bootloader, GRUB, and kernel have been signed.
          All future kernel updates will be automatically signed.

          ===================================
