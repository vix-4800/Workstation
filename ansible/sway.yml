- name: 'Install Sway ecosystem'
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: 'Install Sway ecosystem packages'
      community.general.pacman:
        name:
          - waybar
          - wofi
          - swaync
          - swayidle
          - swaybg
          - wl-clipboard
          - cliphist
          - grim
          - slurp
          - brightnessctl
          - xorg-xwayland
          - libnotify
          - xdg-desktop-portal
          - xdg-desktop-portal-wlr
          # - wlsunset
          # - kanshi
          # - wf-recorder
          - gtklock
        state: present

    - name: 'Check if yay is installed'
      ansible.builtin.command:
        cmd: which yay
      register: yay_check
      changed_when: false
      failed_when: false

    - name: 'Remove standard sway/swaylock before installing enhanced versions'
      community.general.pacman:
        name:
          - sway
          - swaylock
        state: absent
      failed_when: false  # Packages may not be installed
      when: yay_check.rc == 0

    - name: 'Install enhanced Sway packages from AUR'
      kewlfft.aur.aur:
        use: yay
        name:
          - swayfx
          - swaylock-effects
          - wlogout
          - autotiling
        state: present
      when: yay_check.rc == 0
      become: true
      become_user: aur_builder
