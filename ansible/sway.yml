- name: 'Install Sway ecosystem'
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: 'Install Sway ecosystem packages'
      community.general.pacman:
        name:
          - waybar
          - wofi
          - swaync
          - swayidle
          - swaybg
          - wl-clipboard
          - cliphist
          - grim
          - slurp
          - brightnessctl
          - xorg-xwayland
          - libnotify
          - xdg-desktop-portal
          - xdg-desktop-portal-wlr
          # - wlsunset
          # - kanshi
          # - wf-recorder
          - gtklock
          - gtklock-playerctl-module
          - gtklock-userinfo-module
          - tumbler  # Thumbnail service for SwaySettings
          - libgepub  # Tumbler: EPUB thumbnails
          - poppler-glib  # Tumbler: PDF thumbnails
          - libgsf  # Tumbler: ODF thumbnails
          - libopenraw  # Tumbler: RAW image thumbnails
        state: present

    - name: 'Install gtklock-media-background-module build dependencies'
      community.general.pacman:
        name:
          - meson
          - ninja
          - playerctl
          - libsoup3
        state: present

    - name: 'Build gtklock-media-background-module'
      ansible.builtin.command:
        cmd: meson setup build --wipe
        chdir: '{{ playbook_dir }}/../config/gtklock/gtklock-media-background-module'
        creates: '{{ playbook_dir }}/../config/gtklock/gtklock-media-background-module/build/build.ninja'
      become: false

    - name: 'Compile gtklock-media-background-module'
      ansible.builtin.command:
        cmd: meson compile -C build
        chdir: '{{ playbook_dir }}/../config/gtklock/gtklock-media-background-module'
      become: false
      changed_when: true

    - name: 'Install gtklock-media-background-module'
      ansible.builtin.command:
        cmd: meson install -C build
        chdir: '{{ playbook_dir }}/../config/gtklock/gtklock-media-background-module'
      changed_when: true

    - name: 'Create gtklock modules symlink'
      ansible.builtin.file:
        src: /usr/local/lib/gtklock/modules/libmedia-background.so
        dest: /usr/lib/gtklock/media-background-module.so
        state: link
        force: true

    - name: 'Check if yay is installed'
      ansible.builtin.command:
        cmd: which yay
      register: yay_check
      changed_when: false
      failed_when: false

    - name: 'Remove standard sway/swaylock before installing enhanced versions'
      community.general.pacman:
        name:
          - sway
          - swaylock
        state: absent
      failed_when: false  # Packages may not be installed
      when: yay_check.rc == 0

    - name: 'Install enhanced Sway packages from AUR'
      kewlfft.aur.aur:
        use: yay
        name:
          - swayfx
          - swaylock-effects
          - wlogout
          - autotiling
          - swaysettings
        state: present
      when: yay_check.rc == 0
      become: true
      become_user: aur_builder

    - name: 'Enable tumbler daemon for thumbnail generation'
      ansible.builtin.systemd:
        name: tumblerd.service
        enabled: false  # D-Bus activated service, doesn't need to be enabled
        scope: user
      become: false
      failed_when: false
