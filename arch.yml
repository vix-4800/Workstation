---
- name: Provision an Arch Linux workstation
  hosts: workstation_arch
  gather_facts: false

  pre_tasks:
    - name: Load vault/secrets.yml for Arch Linux
      ansible.builtin.include_vars:
        file: vault/secrets.yml
      no_log: true
      tags:
        - always

    - name: Ensure config directory exists
      ansible.builtin.file:
        path: '{{ home }}/.config'
        state: directory
        mode: '0755'
      tags:
        - always

  roles:
    - role: base
      tags:
        - base
    - role: yay
      tags:
        - yay
    - role: cpu
      tags:
        - cpu
    - role: gpu
      tags:
        - gpu
    - role: shell
      tags:
        - shell
    - role: editor
      tags:
        - editor
    - role: audio
      tags:
        - audio
    - role: network
      tags:
        - network
    - role: desktop
      tags:
        - desktop
    - role: appearance
      tags:
        - appearance
    - role: display-manager
      tags:
        - display-manager
    - role: development
      tags:
        - development
    - role: apps
      tags:
        - apps
    - role: services
      tags:
        - services
    - role: ai-tools
      tags:
        - ai-tools

  post_tasks:
    - name: Clean package cache
      ansible.builtin.command:
        cmd: paccache -rk2
      become: true
      changed_when: false
      tags:
        - cleanup
