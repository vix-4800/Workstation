---
extends: default

rules:
  # Required by ansible-lint
  comments-indentation: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true

  # String quoting is not enforced — Ansible YAML is readable without mandatory quotes
  quoted-strings: disable

  # Allow longer lines in task files
  line-length:
    max: 160
    level: warning
