---
- name: Detect the workstation platform
  hosts: all
  gather_facts: true
  tags: [always]

  vars:
    workstation_platform_groups:
      Archlinux: workstation_arch
      Debian: workstation_debian

  tasks:
    - name: Verify the OS family is supported
      ansible.builtin.assert:
        that: ansible_facts.os_family in workstation_platform_groups
        fail_msg: >-
          Unsupported OS family {{ ansible_facts.os_family }}.
          Use Arch Linux or a supported Debian-family distribution.

    - name: Select the platform play for this workstation
      ansible.builtin.group_by:
        key: '{{ workstation_platform_groups[ansible_facts.os_family] }}'
      changed_when: false

- name: Load Arch Linux provisioning
  ansible.builtin.import_playbook: arch.yml

- name: Load Debian-family provisioning
  ansible.builtin.import_playbook: debian.yml
