---
- name: Install cron
  ansible.builtin.apt:
    name: cron
    state: present
  tags:
    - server-init
    - monitor
    - packages

- name: Enable and start cron service
  ansible.builtin.systemd:
    name: cron
    enabled: true
    state: started
  tags:
    - server-init
    - monitor
    - services

- name: Deploy server monitor script
  ansible.builtin.template:
    src: server_monitor.py.j2
    dest: /usr/local/bin/server_monitor
    mode: '0755'
    owner: root
    group: root
  tags:
    - server-init
    - monitor

- name: Schedule daily monitor cron job at 09:00
  ansible.builtin.cron:
    name: server-monitor-daily
    hour: '9'
    minute: '0'
    job: /usr/local/bin/server_monitor
    user: root
    state: present
  tags:
    - server-init
    - monitor
