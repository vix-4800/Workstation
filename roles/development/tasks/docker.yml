---
- name: Install Docker
  community.general.pacman:
    name:
      - docker
      - docker-compose
      - docker-buildx
    state: present
  become: true
  tags:
    - development
    - packages

- name: Add user to docker group
  ansible.builtin.user:
    name: '{{ username }}'
    groups: docker
    append: true
  become: true
  tags:
    - development
    - system

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
  tags:
    - development
    - services
