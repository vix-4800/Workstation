---
- name: Install Python and pipx
  community.general.pacman:
    name: [python, python-pipx]
    state: present
  become: true
  tags: [development, packages]

- name: Install Python tools via pipx
  community.general.pipx:
    name: "{{ item }}"
    state: present
  loop:
    - pre-commit
    - ruff
    - mypy
    - sqlfluff
  become: false
  tags: [development, packages]
