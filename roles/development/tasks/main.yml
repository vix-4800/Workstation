---
- name: Install PHP and tools
  ansible.builtin.include_tasks:
    file: php.yml
    apply:
      tags: [development]
  tags: [development, php]

- name: Install Python tools
  ansible.builtin.include_tasks:
    file: python.yml
    apply:
      tags: [development]
  tags: [development, python]

- name: Install Docker
  ansible.builtin.include_tasks:
    file: docker.yml
    apply:
      tags: [development]
  tags: [development, docker]

- name: Install Rust tools
  ansible.builtin.include_tasks:
    file: rust.yml
    apply:
      tags: [development]
  tags: [development, rust]

- name: Install additional dev tools
  community.general.pacman:
    name:
      - go
      - lua
      - luarocks
      - shellcheck
      - shfmt
      - libxml2
      - editorconfig-checker
      - actionlint
      - stylua
    state: present
  become: true
  tags: [development, packages]

- name: Install additional dev tools (AUR)
  kewlfft.aur.aur:
    name:
      - hadolint
      - checkmake
    state: present
  become: false
  tags: [development, packages]

- name: Deploy tool configs
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/development/files/tools/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: php/phpstan, dest: "{{ home }}/.config/phpstan" }
    - { src: php/rector, dest: "{{ home }}/.config/rector" }
    - { src: php/php-cs-fixer, dest: "{{ home }}/.config/php-cs-fixer" }
    - { src: php/pint, dest: "{{ home }}/.config/pint" }
    - { src: php/phpcs, dest: "{{ home }}/.config/phpcs" }
    - { src: php/phpmd, dest: "{{ home }}/.config/phpmd" }
    - { src: python/ruff, dest: "{{ home }}/.config/ruff" }
    - { src: javascript/eslint, dest: "{{ home }}/.config/eslint" }
    - { src: shellcheck/.shellcheckrc, dest: "{{ home }}/.shellcheckrc" }
    - { src: yaml/yamllint.yml, dest: "{{ home }}/.config/yamllint/config" }
    - { src: markdown/markdownlint, dest: "{{ home }}/.config/markdownlint" }
    - { src: commitlint, dest: "{{ home }}/.config/commitlint" }
    - { src: prettier/.prettierrc, dest: "{{ home }}/.prettierrc" }
    - { src: prettier/.prettierignore, dest: "{{ home }}/.prettierignore" }
    - { src: docker/hadolint.yaml, dest: "{{ home }}/.config/hadolint.yaml" }
    - { src: lua/stylua, dest: "{{ home }}/.config/stylua" }
    - { src: css/stylelint/.stylelintrc.json, dest: "{{ home }}/.stylelintrc.json" }
    - { src: html/linthtml/.linthtmlrc, dest: "{{ home }}/.linthtmlrc" }
    - { src: ansible/ansible-lint/.ansible-lint, dest: "{{ home }}/.ansible-lint" }
    - { src: sql/sqlfluff/.sqlfluff, dest: "{{ home }}/.sqlfluff" }
    - {
        src: editorconfig/.editorconfig-checker.json,
        dest: "{{ home }}/.editorconfig-checker.json",
      }
    - { src: json/jsonlint/.jsonlintrc, dest: "{{ home }}/.jsonlintrc" }
    - { src: make/checkmake, dest: "{{ home }}/.config/checkmake" }
  loop_control:
    label: "{{ item.src }}"
  tags: [development, config]

- name: Install ESLint config dependencies
  ansible.builtin.command:
    cmd: >-
      fish -lc
      "nvm use --silent lts >/dev/null;
      cd {{ home }}/.config/eslint && npm install --silent"
  register: eslint_deps_install
  changed_when: "'added' in eslint_deps_install.stdout"
  tags: [development, packages]

- name: Deploy helper scripts
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/development/scripts/{{ item }}"
    dest: "{{ home }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - check-composer-updates
    - check-dotfiles-updates
  tags: [development, config]
