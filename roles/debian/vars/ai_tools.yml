---
debian_ai_files: '{{ dotfiles_dir }}/roles/ai-tools/files'
debian_ai_adopt_script: '{{ dotfiles_dir }}/roles/debian/scripts/adopt-config'
debian_ai_environment:
  HOME: '{{ home }}'
  XDG_CONFIG_HOME: '{{ debian_config_home }}'
  XDG_DATA_HOME: '{{ debian_data_home }}'
  PATH: >-
    {{ home }}/.local/bin:{{ home }}/.cargo/bin:{{ ansible_facts.env.PATH
       | default("/usr/local/bin:/usr/bin:/bin") }}

debian_ai_npm_tools:
  - { binary: codex, package: '@openai/codex' }
  - { binary: intelephense, package: intelephense }
  - { binary: pyright-langserver, package: pyright }

debian_ai_lua_release:
  name: lua-language-server
  version: 3.19.2
  tag: 3.19.2
  repo: LuaLS/lua-language-server
  asset:
    amd64: lua-language-server-3.19.2-linux-x64.tar.gz
    arm64: lua-language-server-3.19.2-linux-arm64.tar.gz
  sha256:
    amd64: 93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947
    arm64: 17b8e401a874440adeb649e5024c364f2bb9d15156c74a40e56d1ae9a1b2e4f2
  binary_path:
    amd64: bin/lua-language-server
    arm64: bin/lua-language-server
  archive: true

# Playwright Firefox uses these libraries on Debian-family distributions.
debian_ai_packages:
  - bubblewrap
  - gopls
  - pipx
  - socat
  - xvfb
  - '{{ "libasound2t64" if "libasound2t64" in debian_apt_candidates else "libasound2" }}'
  - '{{ "libatk1.0-0t64" if "libatk1.0-0t64" in debian_apt_candidates else "libatk1.0-0" }}'
  - libcairo-gobject2
  - libcairo2
  - libdbus-1-3
  - libfontconfig1
  - libfreetype6
  - libgdk-pixbuf-2.0-0
  - '{{ "libglib2.0-0t64" if "libglib2.0-0t64" in debian_apt_candidates else "libglib2.0-0" }}'
  - '{{ "libgtk-3-0t64" if "libgtk-3-0t64" in debian_apt_candidates else "libgtk-3-0" }}'
  - libharfbuzz0b
  - libpango-1.0-0
  - libpangocairo-1.0-0
  - libx11-6
  - libx11-xcb1
  - libxcb-shm0
  - libxcb1
  - libxcomposite1
  - libxcursor1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxi6
  - libxrandr2
  - libxrender1
  - libxtst6

debian_ai_libavcodec: [libavcodec63, libavcodec62, libavcodec61, libavcodec60, libavcodec59]
