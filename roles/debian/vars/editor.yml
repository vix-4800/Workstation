---
debian_editor_files: '{{ dotfiles_dir }}/roles/editor/files'
debian_editor_scripts: '{{ dotfiles_dir }}/roles/editor/scripts'
debian_config_adopt_script: '{{ dotfiles_dir }}/roles/debian/scripts/adopt-config'

# https://cdn.kernel.org/pub/software/scm/git/sha256sums.asc
debian_git_release: '2.56.1'
debian_git_release_sha256: f0b0bf89264b9bd2e1c640363e7529643989da76281600473c50745cd34a607f
debian_git_prefix: '{{ home }}/.local/lib/workstation/git/{{ debian_git_release }}'
debian_git_build_packages:
  - build-essential
  - gettext
  - libexpat1-dev
  - libpcre2-dev
  - libssl-dev
  - xz-utils
  - zlib1g-dev

debian_editor_config_links:
  - { src: '{{ debian_editor_files }}/git/gitconfig', dest: '{{ home }}/.gitconfig.workstation' }
  - { src: '{{ debian_editor_files }}/git/delta.gitconfig', dest: '{{ home }}/.gitconfig.delta' }
  - { src: '{{ debian_editor_files }}/nvim', dest: '{{ debian_config_home }}/nvim' }
  - { src: '{{ debian_editor_files }}/code/User/keybindings.json', dest: '{{ debian_config_home }}/Code/User/keybindings.json' }
  - { src: '{{ debian_editor_files }}/code/User/tasks.json', dest: '{{ debian_config_home }}/Code/User/tasks.json' }
  - { src: '{{ debian_editor_files }}/code/User/mcp.json', dest: '{{ debian_config_home }}/Code/User/mcp.json' }
  - { src: '{{ debian_editor_scripts }}/check-secrets', dest: '{{ home }}/.local/bin/check-secrets' }
  - { src: '{{ debian_editor_scripts }}/check-staged-php', dest: '{{ home }}/.local/bin/check-staged-php' }

debian_code_extensions:
  - Catppuccin.catppuccin-vsc
  - Catppuccin.catppuccin-vsc-icons

# nvim-treesitter's main branch requires Neovim >= 0.12 and tree-sitter >= 0.26.1.
debian_editor_releases:
  - name: nvim
    version: '0.12.6'
    repo: neovim/neovim
    asset:
      amd64: nvim-linux-x86_64.tar.gz
      arm64: nvim-linux-arm64.tar.gz
    sha256:
      amd64: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
      arm64: 8f1f64a0bdb97247034038c3823c6cbad5bdf9ecd5751b85494b71c3ee04c815
    binary_path:
      amd64: nvim-linux-x86_64/bin/nvim
      arm64: nvim-linux-arm64/bin/nvim
    archive: true
  - name: tree-sitter
    version: '0.26.13'
    repo: tree-sitter/tree-sitter
    asset:
      amd64: tree-sitter-cli-linux-x64.zip
      arm64: tree-sitter-cli-linux-arm64.zip
    sha256:
      amd64: 1b781c0dc1dfefea44b5db2ec2a58440fe9d006856c3f5b3fd9a17119d1138a2
      arm64: 72c6d6c669c70491f93db290b285d9e85fd68ead9e324cc55ace35a1be66c3bd
    archive: true
  - name: delta
    version: '0.21.2'
    tag: '0.21.2'
    repo: dandavison/delta
    asset:
      amd64: delta-0.21.2-x86_64-unknown-linux-musl.tar.gz
      arm64: delta-0.21.2-aarch64-unknown-linux-gnu.tar.gz
    sha256:
      amd64: d4c55c9b9991c308cad84412e8a8afdc990779e4dd021f6ebb277a4249719b9f
      arm64: 36dca3ddb293d2fa635aa2bf9c53c0ba2d38dcd749290d81c6685974cf3799c4
    binary_path:
      amd64: delta-0.21.2-x86_64-unknown-linux-musl/delta
      arm64: delta-0.21.2-aarch64-unknown-linux-gnu/delta
    archive: true
