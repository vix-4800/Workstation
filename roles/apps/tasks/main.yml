---
- name: Remove conflicting exfat-utils before installing exfatprogs
  community.general.pacman:
    name: exfat-utils
    state: absent
  become: true
  tags: [apps, packages]

- name: Check for legacy system pip packages that conflict with pacman waypaper stack
  ansible.builtin.command:
    cmd: python -m pip show {{ item }}
  loop: "{{ apps_waypaper_legacy_pip_packages }}"
  loop_control:
    label: "{{ item }}"
  register: apps_waypaper_pip_show
  changed_when: false
  failed_when: false
  when: apps_waypaper_aur_packages | length > 0
  tags: [apps, packages]

- name: Remove legacy system pip packages before pacman install
  ansible.builtin.command:
    cmd: python -m pip uninstall --break-system-packages -y {{ item.item }}
  loop: "{{ apps_waypaper_pip_show.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  become: true
  when:
    - apps_waypaper_aur_packages | length > 0
    - item.rc == 0
    - "'Location: /usr/lib/python' in item.stdout"
  register: apps_waypaper_pip_uninstall
  changed_when: true
  tags: [apps, packages]

- name: Install applications
  community.general.pacman:
    name: "{{ apps_packages }}"
    state: present
  become: true
  tags: [apps, packages]

- name: Install AUR applications
  kewlfft.aur.aur:
    name: "{{ item }}"
    state: present
  become: false
  loop: "{{ apps_aur_packages }}"
  loop_control:
    label: "{{ item }}"
  tags: [apps, packages]

- name: Check if waypaper AUR packages are installed
  ansible.builtin.command:
    cmd: pacman -Q {{ item }}
  loop: "{{ apps_waypaper_aur_packages }}"
  loop_control:
    label: "{{ item }}"
  register: apps_waypaper_installed
  changed_when: false
  failed_when: false
  tags: [apps, packages]

- name: Ensure temporary build directory exists for waypaper stack
  ansible.builtin.file:
    path: /tmp/aur-build
    state: directory
    mode: "0755"
  tags: [apps, packages]

- name: Clone waypaper AUR repositories
  ansible.builtin.git:
    repo: "https://aur.archlinux.org/{{ item.item }}.git"
    dest: "/tmp/aur-build/{{ item.item }}"
    version: master
    update: true
    force: true
  loop: "{{ apps_waypaper_installed.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  tags: [apps, packages]

- name: Determine package archive paths for waypaper stack
  ansible.builtin.command:
    cmd: makepkg --packagelist --nodeps
    chdir: "/tmp/aur-build/{{ item.item }}"
  loop: "{{ apps_waypaper_installed.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  register: apps_waypaper_packagelist
  changed_when: false
  tags: [apps, packages]

- name: Build waypaper AUR packages without helper sudo
  ansible.builtin.command:
    cmd: makepkg --nodeps --noconfirm --force --clean --cleanbuild
    chdir: "/tmp/aur-build/{{ item.item.item }}"
  loop: "{{ apps_waypaper_packagelist.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item }}"
  when:
    - item.skipped is not defined
    - item.stdout_lines | length > 0
  changed_when: true
  tags: [apps, packages]

- name: Install built waypaper AUR packages
  ansible.builtin.command:
    argv:
      - pacman
      - -U
      - --noconfirm
      - "{{ item.stdout_lines[0] }}"
  loop: "{{ apps_waypaper_packagelist.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item }}"
  become: true
  when:
    - item.skipped is not defined
    - item.stdout_lines | length > 0
  changed_when: true
  tags: [apps, packages]

- name: Enable auto-cpufreq service
  ansible.builtin.systemd:
    name: auto-cpufreq
    enabled: true
    state: started
  become: true
  when: has_battery | default(false)
  tags: [apps, services]

- name: Add Flathub remote
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    method: user
  tags: [apps, packages]
