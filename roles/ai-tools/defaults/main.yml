---
ai_tools_packages:
  - npm
  - uv

ai_tools_npm_packages:
  - "@openai/codex"

ai_configs:
  - { src: claude/settings.json, dest: "{{ home }}/.claude/settings.json" }
  - { src: claude/CLAUDE.md, dest: "{{ home }}/.claude/CLAUDE.md" }
  - { src: opencode, dest: "{{ home }}/.config/opencode" }
  - { src: codex/config.toml, dest: "{{ home }}/.codex/config.toml" }
  - { src: codex/AGENTS.md, dest: "{{ home }}/.codex/AGENTS.md" }
  - { src: qwen/settings.json, dest: "{{ home }}/.qwen/settings.json" }
  - { src: mcp/serena/serena_config.yml, dest: "{{ home }}/.serena/serena_config.yml" }
  - { src: agents/skills, dest: "{{ home }}/.agents/skills" }
  - { src: agents/skills, dest: "{{ home }}/.qwen/skills" }

ai_templates:
  - { src: env/github-token.sh.j2, dest: "{{ home }}/.config/workstation/env/github-token.sh" }
  - { src: env/github-token.fish.j2, dest: "{{ home }}/.config/workstation/env/github-token.fish" }
