---
- name: Install AI tool packages
  community.general.pacman:
    name: "{{ ai_tools_packages }}"
    state: present
  become: true
  tags: [ai-tools, packages]

- name: Install AI npm CLIs
  community.general.npm:
    name: "{{ item }}"
    global: true
  loop: "{{ ai_tools_npm_packages }}"
  loop_control:
    label: "{{ item }}"
  become: false
  tags: [ai-tools, packages]

- name: Install Claude CLI
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://claude.ai/install.sh | bash
    creates: "{{ home }}/.local/bin/claude"
    executable: /bin/bash
  become: false
  tags: [ai-tools, packages]

- name: Install Qwen CLI
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if command -v qwen >/dev/null 2>&1; then
        exit 0
      fi
      curl -fsSL https://qwen-code-assets.oss-cn-hangzhou.aliyuncs.com/installation/install-qwen.sh | bash
    executable: /bin/bash
  register: qwen_cli_install
  changed_when: "'Qwen Code installed successfully!' in qwen_cli_install.stdout"
  failed_when: >
    qwen_cli_install.rc != 0 and (
      'No input provided via stdin' not in qwen_cli_install.stderr or
      'Qwen Code installed successfully!' not in qwen_cli_install.stdout
    )
  become: false
  tags: [ai-tools, packages]

- name: Ensure AI config parent directories exist
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ ai_configs }}"
  loop_control:
    label: "{{ item.dest | dirname }}"
  tags: [ai-tools, config]

- name: Deploy AI tool configs
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/ai-tools/files/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ ai_configs }}"
  loop_control:
    label: "{{ item.src }}"
  tags: [ai-tools, config]
