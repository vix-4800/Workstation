model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "medium"

[analytics]
enabled = false

[feedback]
enabled = false

[features]
multi_agent = true

[tui]
theme = "catppuccin-mocha"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.serena]
enabled = true
command = "uvx"
args = [
  "--from",
  "git+https://github.com/oraios/serena",
  "serena",
  "start-mcp-server",
  "--context",
  "codex",
  "--open-web-dashboard",
  "False",
]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.docker]
command = "uvx"
args = ["--with", "fastmcp[tasks]", "mcp-docker"]
startup_timeout_sec = 30
