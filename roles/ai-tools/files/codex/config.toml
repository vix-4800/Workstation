model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "medium"

[analytics]
enabled = false

[feedback]
enabled = false

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[tui]
theme = "catppuccin-mocha"

[profiles.default]
model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "medium"

[profiles.review]
model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.php]
model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[profiles.devops]
model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.serena]
enabled = true
command = "uvx"
args = [
  "--from",
  "git+https://github.com/oraios/serena",
  "serena",
  "start-mcp-server",
  "--context",
  "codex",
  "--open-web-dashboard",
  "False",
]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.docker]
command = "uvx"
args = ["--with", "fastmcp[tasks]", "mcp-docker"]
startup_timeout_sec = 30

[mcp_servers.docker.env]
SECURITY_AUDIT_LOG_ENABLED = "false"
MCP_DOCKER_LOG_PATH = "/dev/null"
