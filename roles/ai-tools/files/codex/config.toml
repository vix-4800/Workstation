model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
model_verbosity = "low"
file_opener = "vscode"
notify = [
  "notify-send",
  "Codex",
  "Codex needs your attention",
  "-u",
  "normal",
  "-i",
  "dialog-warning",
]
commit_attribution = "Codex <codex@openai.com>"
disable_paste_burst = true

[shell_environment_policy]
inherit = "core"

[analytics]
enabled = false

[feedback]
enabled = false

[features]
multi_agent = true
apps = true
codex_hooks = true
fast_mode = false
shell_snapshot = true

[agents]
max_threads = 6
max_depth = 2

[tui]
theme = "catppuccin-mocha"
notifications = true
status_line = ["current-dir", "git-branch", "model-with-reasoning", "context-remaining"]

[profiles.default]
model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "medium"

[profiles.review]
model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.php]
model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[profiles.devops]
model = "gpt-5.4"
web_search = "cached"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.serena]
command = "uvx"
args = [
  "--from",
  "git+https://github.com/oraios/serena",
  "serena",
  "start-mcp-server",
  "--context",
  "codex",
  "--open-web-dashboard",
  "False",
]

[mcp_servers.serena.tools.write_memory]
approval_mode = "approve"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.docker]
command = "uvx"
args = ["--with", "fastmcp[tasks]", "mcp-docker"]
startup_timeout_sec = 30.0

[mcp_servers.docker.env]
MCP_DOCKER_LOG_PATH = "/dev/null"
SECURITY_AUDIT_LOG_ENABLED = "false"

[mcp_servers.docker.tools.docker_version]
approval_mode = "approve"

[mcp_servers.docker.tools.docker_list_containers]
approval_mode = "approve"

[mcp_servers.docker.tools.docker_list_images]
approval_mode = "approve"

[mcp_servers.docker.tools.docker_container_logs]
approval_mode = "approve"

[mcp_servers.docker.tools.docker_container_stats]
approval_mode = "approve"

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[plugins."github@openai-curated"]
enabled = true
