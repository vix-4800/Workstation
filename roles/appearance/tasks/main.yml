---
- name: Install fonts
  community.general.pacman:
    name:
      - ttf-jetbrains-mono-nerd
      - otf-font-awesome
      - ttf-dejavu
      - ttf-liberation
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      - ttf-opensans
      - ttf-roboto
      - ttf-ubuntu-font-family
      - inter-font
      - freetype2
      - fontconfig
    state: present
  become: true
  tags: [appearance, packages]

- name: Install cursor theme
  kewlfft.aur.aur:
    name: catppuccin-cursors-mocha
    state: present
  become: false
  tags: [appearance, packages]

- name: Install icon theme
  community.general.pacman:
    name: papirus-icon-theme
    state: present
  become: true
  tags: [appearance, packages]

- name: Install plymouth
  community.general.pacman:
    name: plymouth
    state: present
  become: true
  tags: [appearance, packages]

- name: Install nwg-look (AUR)
  kewlfft.aur.aur:
    name: nwg-look
    state: present
  become: true
  tags: [appearance, packages]

- name: Deploy bat config and themes
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/bat"
    dest: "{{ home }}/.config/bat"
    state: link
    force: true
  tags: [appearance, config]

- name: Build bat cache
  ansible.builtin.command:
    cmd: bat cache --build
  changed_when: false
  tags: [appearance, config]

- name: Deploy wallpapers
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/wallpapers"
    dest: "{{ home }}/Pictures/Wallpapers"
    state: link
    force: true
  tags: [appearance, config]

- name: Deploy themes directory
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/themes"
    dest: "{{ home }}/.config/themes"
    state: link
    force: true
  tags: [appearance, config]

- name: Deploy GRUB theme
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/themes/grub/catppuccin-mocha-grub-theme"
    dest: /boot/grub/themes/catppuccin-mocha
    state: link
    force: true
  become: true
  tags: [appearance, system]

- name: Check Plymouth theme path type
  ansible.builtin.stat:
    path: /usr/share/plymouth/themes/catppuccin-mocha
  register: appearance_plymouth_stat
  tags: [appearance, system]

- name: Remove existing Plymouth theme directory if not a symlink
  ansible.builtin.file:
    path: /usr/share/plymouth/themes/catppuccin-mocha
    state: absent
  become: true
  when: appearance_plymouth_stat.stat.exists and not appearance_plymouth_stat.stat.islnk
  tags: [appearance, system]

- name: Deploy Plymouth theme
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/themes/plymouth/catppuccin-mocha"
    dest: /usr/share/plymouth/themes/catppuccin-mocha
    state: link
    force: true
  become: true
  tags: [appearance, system]

- name: Deploy avatar
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/avatar.jpg"
    dest: "{{ home }}/.face"
    state: link
    force: true
  tags: [appearance, config]
