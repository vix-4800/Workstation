[env]
TERM = "xterm-256color"

[general]
live_config_reload = true
import = ["~/.config/alacritty/catppuccin-mocha.toml"]

# ——— WINDOW ———————————————————————————————————————
[window]
decorations = "none"
decorations_theme_variant = "Dark"
dynamic_padding = true
dynamic_title = true
opacity = 0.80

[window.padding]
x = 12
y = 12

# ——— CURSOR ———————————————————————————————————————
[cursor]
blink_interval = 300
blink_timeout = 30
unfocused_hollow = false

[cursor.style]
shape = "Beam"
blinking = "Always"

# ——— FONT ———————————————————————————————————————
[font]
size = 14

[font.offset]
x = 0
y = 1

# Better font rendering
[font.glyph_offset]
x = 0
y = 0

# ——— SCROLLING ———————————————————————————————————
[scrolling]
history = 10000
multiplier = 3

# ——— MOUSE ———————————————————————————————————————
[mouse]
hide_when_typing = true

# ——— BELL ———————————————————————————————————————
[bell]
animation = "EaseOut"
duration = 0
color = "#000000"
command = "None"

# Performance improvements
[debug]
log_level = "OFF"

# ——— TERMINAL —————————————————————————————————————
[terminal.shell]
program = "/usr/bin/fish"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
