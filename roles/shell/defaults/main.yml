---
shell_packages:
  - fish
  - alacritty
  - kitty
  - zellij
  - tmux
  - nodejs

node_global_packages:
  - markdownlint-cli2
  - "@commitlint/cli"
  - "@commitlint/config-conventional"
  - "@openai/codex"

shell_configs:
  - { src: fish, dest: "{{ home }}/.config/fish" }
  - { src: alacritty, dest: "{{ home }}/.config/alacritty" }
  - { src: kitty, dest: "{{ home }}/.config/kitty" }
  - { src: zellij, dest: "{{ home }}/.config/zellij" }
  - { src: terminal-companion, dest: "{{ home }}/.config/terminal-companion" }
  - { src: tmux, dest: "{{ home }}/.config/tmux" }
  - { src: shell/aliases, dest: "{{ home }}/.aliases" }
  - { src: .profile, dest: "{{ home }}/.profile" }
  - { src: bash/.bash_profile, dest: "{{ home }}/.bash_profile" }
  - { src: bash/bashrc, dest: "{{ home }}/.bashrc" }

shell_scripts:
  - companion-session
  - terminal-companion
