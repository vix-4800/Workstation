---
- name: Build gtklock-media-background-module
  ansible.builtin.command:
    cmd: meson setup build --reconfigure
    chdir: '{{ dotfiles_dir }}/roles/desktop/files/gtklock/gtklock-media-background-module'
  changed_when: true
  tags:
    - desktop
    - packages

- name: Compile gtklock-media-background-module
  ansible.builtin.command:
    cmd: meson compile -C build
    chdir: '{{ dotfiles_dir }}/roles/desktop/files/gtklock/gtklock-media-background-module'
  changed_when: true
  tags:
    - desktop
    - packages

- name: Install gtklock-media-background-module
  ansible.builtin.command:
    cmd: meson install -C build
    chdir: '{{ dotfiles_dir }}/roles/desktop/files/gtklock/gtklock-media-background-module'
  become: true
  changed_when: true
  tags:
    - desktop
    - packages

- name: Build gtklock-network-module
  ansible.builtin.command:
    cmd: meson setup build --reconfigure
    chdir: '{{ dotfiles_dir }}/roles/desktop/files/gtklock/gtklock-network-module'
  changed_when: true
  tags:
    - desktop
    - packages

- name: Compile gtklock-network-module
  ansible.builtin.command:
    cmd: meson compile -C build
    chdir: '{{ dotfiles_dir }}/roles/desktop/files/gtklock/gtklock-network-module'
  changed_when: true
  tags:
    - desktop
    - packages

- name: Install gtklock-network-module
  ansible.builtin.command:
    cmd: meson install -C build
    chdir: '{{ dotfiles_dir }}/roles/desktop/files/gtklock/gtklock-network-module'
  become: true
  changed_when: true
  tags:
    - desktop
    - packages

- name: Build gtklock-battery-module
  ansible.builtin.command:
    cmd: meson setup build --reconfigure
    chdir: '{{ dotfiles_dir }}/roles/desktop/files/gtklock/gtklock-battery-module'
  changed_when: true
  when: has_battery
  tags:
    - desktop
    - packages

- name: Compile gtklock-battery-module
  ansible.builtin.command:
    cmd: meson compile -C build
    chdir: '{{ dotfiles_dir }}/roles/desktop/files/gtklock/gtklock-battery-module'
  changed_when: true
  when: has_battery
  tags:
    - desktop
    - packages

- name: Install gtklock-battery-module
  ansible.builtin.command:
    cmd: meson install -C build
    chdir: '{{ dotfiles_dir }}/roles/desktop/files/gtklock/gtklock-battery-module'
  become: true
  changed_when: true
  when: has_battery
  tags:
    - desktop
    - packages

- name: Deploy gtklock config
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/roles/desktop/files/gtklock'
    dest: '{{ home }}/.config/gtklock'
    state: link
    force: true
  tags:
    - desktop
    - config
