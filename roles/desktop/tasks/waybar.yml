---
- name: Install Waybar
  community.general.pacman:
    name: waybar
    state: present
  become: true
  tags: [desktop, packages]

- name: Check if waybar config dir is a symlink
  ansible.builtin.stat:
    path: "{{ home }}/.config/waybar"
  register: desktop_waybar_stat
  tags: [desktop, config]

- name: Remove old waybar directory symlink if present
  ansible.builtin.file:
    path: "{{ home }}/.config/waybar"
    state: absent
  when: desktop_waybar_stat.stat.exists and desktop_waybar_stat.stat.islnk
  tags: [desktop, config]

- name: Ensure waybar config directory exists
  ansible.builtin.file:
    path: "{{ home }}/.config/waybar"
    state: directory
    mode: "0755"
  tags: [desktop, config]

- name: Deploy static waybar files
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/desktop/files/waybar/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ desktop_waybar_files }}"
  loop_control:
    label: "{{ item.src }}"
  tags: [desktop, config]

- name: Deploy waybar weather location
  ansible.builtin.template:
    src: waybar/weather-location.j2
    dest: "{{ home }}/.config/waybar/weather-location"
    mode: "0644"
  tags: [desktop, config]

- name: Deploy waybar config
  ansible.builtin.template:
    src: waybar/config.jsonc.j2
    dest: "{{ home }}/.config/waybar/config.jsonc"
    mode: "0644"
  tags: [desktop, config]
