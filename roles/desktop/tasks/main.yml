---
- name: Install Sway ecosystem
  ansible.builtin.include_tasks:
    file: sway.yml
    apply:
      tags: [desktop]
  tags: [desktop, sway]

- name: Setup Waybar
  ansible.builtin.include_tasks:
    file: waybar.yml
    apply:
      tags: [desktop]
  tags: [desktop, waybar]

- name: Build and install gtklock modules
  ansible.builtin.include_tasks:
    file: gtklock.yml
    apply:
      tags: [desktop]
  tags: [desktop, gtklock]

- name: Setup notifications
  ansible.builtin.include_tasks:
    file: notifications.yml
    apply:
      tags: [desktop]
  tags: [desktop, notifications]

- name: Deploy desktop configs
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/desktop/files/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ desktop_configs }}"
  loop_control:
    label: "{{ item.src }}"
  tags: [desktop, config]
