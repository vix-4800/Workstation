# Window rules and workspace configuration

# ===== Workspace Behavior =====
workspace_auto_back_and_forth yes

# ===== Workspace Assignments =====
assign [app_id="firefox"] workspace number 2
assign [class="firefox"] workspace number 2
assign [class="Code"] workspace number 3
assign [app_id="code"] workspace number 3
assign [app_id="discord"] workspace number 4
assign [class="discord"] workspace number 4
assign [class="Discord"] workspace number 4
assign [class="TelegramDesktop"] workspace number 4
assign [app_id="telegram-desktop"] workspace number 4
assign [class="Spotify"] workspace number 5
assign [app_id="spotify"] workspace number 5

# ===== Floating Windows =====
# Terminal
# for_window [app_id="Alacritty"] floating enable, resize set 1600 900

# Notification center
for_window [app_id="swaync"] border none

# System tools
for_window [app_id="pavucontrol"] floating enable, resize set 800 600
for_window [app_id="blueman-manager"] floating enable, resize set 700 500
for_window [app_id="nm-connection-editor"] floating enable, resize set 800 600

# File dialogs
for_window [title="File Upload"] floating enable
for_window [title="Save File"] floating enable
for_window [title="Open File"] floating enable
for_window [app_id="thunar" title="File Operation Progress"] floating enable

# Window roles
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable

# Picture-in-Picture
for_window [title="Picture-in-Picture"] floating enable, sticky enable, resize set 400 225, move position 1200 50
for_window [app_id="firefox" title="^Picture-in-Picture$"] floating enable, sticky enable, resize set 640 360

# Media players
for_window [app_id="vlc"] opacity 1, dim_inactive 0

# Image viewers
for_window [class="feh"] floating enable

# Urgent workspace switching
for_window [urgent="latest"] focus

for_window [app_id="waypaper"] floating enable, resize set 1200 800
for_window [app_id="firefox" title=".*Bitwarden.*"] floating enable
