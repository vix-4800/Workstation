# Autostart configuration

# ===== System Services =====
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# swaync is D-Bus/systemd activated; starting it here creates a duplicate instance.
exec $osd_server
exec wl-paste --watch $clipboard_manager store
exec udiskie --tray
exec_always --no-startup-id bash -lc 'pgrep -x nm-applet >/dev/null || nm-applet --indicator'
exec_always --no-startup-id bash -lc 'pgrep -x blueman-applet >/dev/null || blueman-applet'
exec $wallpaper_manager --restore
exec_always --no-startup-id $idle_manager -w
exec playerctld daemon

# ===== Window Management =====
exec_always autotiling

# ===== Startup Applications =====
# exec --no-startup-id swaymsg 'workspace number 2; exec firefox'
