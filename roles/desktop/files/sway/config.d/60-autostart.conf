# Autostart configuration

# ===== System Services =====
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec $notification_daemon
exec $osd_server
exec wl-paste --watch $clipboard_manager store
exec udiskie --tray
exec blueman-applet
exec $wallpaper_manager --restore
exec_always --no-startup-id $idle_manager -w
exec playerctld daemon

# ===== Window Management =====
exec_always autotiling

