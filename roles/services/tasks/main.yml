---
- name: Check if systemd user dir is a directory symlink
  ansible.builtin.stat:
    path: "{{ home }}/.config/systemd/user"
  register: services_systemd_stat
  tags: [services, config]

- name: Remove old directory symlink if present
  ansible.builtin.file:
    path: "{{ home }}/.config/systemd/user"
    state: absent
  when: services_systemd_stat.stat.exists and services_systemd_stat.stat.islnk
  tags: [services, config]

- name: Ensure systemd user directory exists
  ansible.builtin.file:
    path: "{{ home }}/.config/systemd/user"
    state: directory
    mode: "0755"
  tags: [services, config]

- name: Find service and timer files
  ansible.builtin.find:
    paths: "{{ dotfiles_dir }}/roles/services/files"
    file_type: file
  register: services_unit_files
  tags: [services, config]

- name: Deploy systemd user service and timer files
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ home }}/.config/systemd/user/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ services_unit_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: reload systemd user
  tags: [services, config]

- name: Reload systemd user daemon before enabling units
  ansible.builtin.meta: flush_handlers

- name: Enable common services
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
  loop: "{{ services_common }}"
  tags: [services]

- name: Enable batsignal (battery monitoring)
  ansible.builtin.systemd:
    name: batsignal.service
    scope: user
    enabled: true
    state: started
  when: has_battery | default(false)
  tags: [services]

- name: Enable host-specific services
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
  loop: "{{ services_host }}"
  when: services_host | length > 0
  tags: [services]
