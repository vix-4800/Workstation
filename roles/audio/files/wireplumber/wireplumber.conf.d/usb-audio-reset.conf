# WirePlumber rules for USB audio devices

monitor.alsa.rules = [
    {
        matches = [
            {
                # Match all USB audio sink nodes
                device.bus = "usb"
                media.class = "Audio/Sink"
            }
        ]
        actions = {
            update-props = {
                node.pause-on-idle = false
            }
        }
    }
]
