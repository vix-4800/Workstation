# Software mixer for Redmi USB speaker
# The hardware ALSA mixer on this device has a minimum dB floor that sits well
# above silence. When PipeWire tries to go below that floor (roughly 56% on
# the hardware scale) ALSA hard-mutes instead of continuing to attenuate.
# Setting soft-mixer forces PipeWire to keep the hardware control at max and
# apply the full 0-100% range in software, giving smooth linear volume control.

monitor.alsa.rules = [
    {
        matches = [
            {
                device.name = "~alsa_card.usb-MV-SILICON_Redmi.*"
            }
        ]
        actions = {
            update-props = {
                api.alsa.soft-mixer = true
            }
        }
    }
]
