# PulseAudio flat-volumes behaviour
# With flat-volumes disabled (PipeWire default), each stream gets its own
# independent volume level. Spotify and some other apps end up quieter because
# they previously saved a low per-stream volume in the PipeWire state database.
# Enabling flat-volumes makes the master volume track the loudest stream,
# restoring the classic PulseAudio behaviour that most apps were designed for.

pulse.properties = {
    flat-volumes = true
}
