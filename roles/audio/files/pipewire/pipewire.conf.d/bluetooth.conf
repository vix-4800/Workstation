# Bluetooth optimization for low-latency audio with EasyEffects
# Reduces buffer sizes to prevent audio artifacts and stuttering

context.properties = {
    # Optimize quantum for Bluetooth devices
    # Lower values = less latency, better for BT
    default.clock.quantum       = 256
    default.clock.min-quantum   = 128
    default.clock.max-quantum   = 512

    # Limit quantum to prevent excessive buffering
    default.clock.quantum-limit = 2048
}

# Specific rules for Bluetooth nodes
context.modules = [
    {   name = libpipewire-module-adapter
        flags = [ ifexists nofail ]
    }
]
