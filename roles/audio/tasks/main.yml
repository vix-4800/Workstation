---
- name: Install audio packages
  community.general.pacman:
    name: "{{ audio_packages }}"
    state: present
  become: true
  tags: [audio, packages]

- name: Install multimedia packages
  community.general.pacman:
    name: "{{ multimedia_packages }}"
    state: present
  become: true
  tags: [audio, packages]

- name: Deploy audio configs
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/audio/files/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ audio_configs }}"
  loop_control:
    label: "{{ item.src }}"
  tags: [audio, config]
