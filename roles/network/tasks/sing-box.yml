---
- name: Install sing-box
  kewlfft.aur.aur:
    name: sing-box
    state: present
  become: false
  tags: [network, packages]

- name: Configure IP forwarding sysctl for TUN mode
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-sing-box-forwarding.conf
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: apply sysctl settings
  tags: [network, system]

- name: Add sudoers rules for passwordless sing-box management
  ansible.builtin.copy:
    dest: /etc/sudoers.d/sing-box
    content: |
      %wheel ALL=(ALL) NOPASSWD: /usr/bin/systemctl start sing-box
      %wheel ALL=(ALL) NOPASSWD: /usr/bin/systemctl stop sing-box
      %wheel ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart sing-box
      %wheel ALL=(ALL) NOPASSWD: /usr/bin/tee /etc/sing-box/config.json
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  tags: [network, system]

- name: Ensure sing-box is disabled at boot
  ansible.builtin.systemd:
    name: sing-box
    enabled: false
    daemon_reload: true
  become: true
  failed_when: false
  tags: [network, services]

- name: Deploy sing-box profiles
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/network/files/sing-box"
    dest: "{{ home }}/.config/sing-box"
    state: link
    force: true
  tags: [network, config]
