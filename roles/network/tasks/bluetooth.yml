---
- name: Install bluetooth packages
  community.general.pacman:
    name:
      - bluez
      - bluez-utils
      - blueman
      - network-manager-applet
    state: present
  become: true
  tags:
    - network
    - packages

- name: Deploy bluetooth config
  # ProtectHome=true prevents bluetoothd from reading symlinks into the repository.
  ansible.builtin.copy:
    src: '{{ dotfiles_dir }}/roles/network/files/bluetooth/main.conf'
    dest: /etc/bluetooth/main.conf
    remote_src: true
    follow: false
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart bluetooth
  tags:
    - network
    - config
    - system

- name: Enable bluetooth service
  ansible.builtin.systemd:
    name: bluetooth
    enabled: true
    state: started
  become: true
  tags:
    - network
    - services
