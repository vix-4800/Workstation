---
- name: Install NetworkManager and wireguard tools
  community.general.pacman:
    name:
      - networkmanager
      - wireguard-tools
    state: present
  become: true
  tags: [network, packages]

- name: Deploy WireGuard config from vault
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  become: true
  register: network_wg_config
  tags: [network, config]

- name: Enable NetworkManager service
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started
  become: true
  tags: [network, services]

- name: List existing WireGuard connections in NetworkManager
  ansible.builtin.command:
    cmd: nmcli --terse --escape no --fields NAME,UUID,TYPE connection show
  become: true
  register: network_wg_connections
  changed_when: false
  tags: [network, config]

- name: Collect existing WireGuard profile names for wg0
  ansible.builtin.set_fact:
    network_wg_profile_uuids: >-
      {{
        network_wg_connections.stdout_lines
        | select('match', '^wg0:[^:]+:wireguard$')
        | map('regex_replace', '^wg0:([^:]+):wireguard$', '\\1')
        | list
      }}
  changed_when: false
  tags: [network, config]

- name: Remove existing WireGuard connections before import
  ansible.builtin.command:
    cmd: nmcli connection delete uuid {{ item }}
  become: true
  changed_when: true
  loop: "{{ network_wg_profile_uuids }}"
  when:
    - network_wg_config.changed or network_wg_profile_uuids | length > 1
  tags: [network, config]

- name: Import WireGuard connection to NetworkManager
  ansible.builtin.command:
    cmd: nmcli connection import type wireguard file /etc/wireguard/wg0.conf
  become: true
  changed_when: true
  when:
    - network_wg_config.changed
      or network_wg_profile_uuids | length == 0
      or network_wg_profile_uuids | length > 1
  tags: [network, config]
