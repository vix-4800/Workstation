---
- name: Install NetworkManager and wireguard tools
  community.general.pacman:
    name:
      - networkmanager
      - wireguard-tools
    state: present
  become: true
  tags:
    - network
    - packages

- name: Normalize WireGuard profiles from vault
  ansible.builtin.set_fact:
    network_wireguard_profiles: >-
      {{
        vault_wg_profiles
        if (vault_wg_profiles is defined)
        else (
          [
            {
              'name': 'wg0',
              'private_key': vault_wg_private_key,
              'address': vault_wg_address,
              'dns': vault_wg_dns,
              'peer_public_key': vault_wg_peer_public_key,
              'preshared_key': vault_wg_preshared_key | default(''),
              'persistent_keepalive': vault_wg_persistent_keepalive,
              'endpoint': vault_wg_endpoint
            }
          ]
          if (vault_wg_private_key is defined)
          else []
        )
      }}
  changed_when: false
  tags:
    - network
    - config

- name: Validate WireGuard profile names
  ansible.builtin.set_fact:
    network_wireguard_profile_count: '{{ network_wireguard_profiles | length }}'
    network_wireguard_named_profile_count: >-
      {{ network_wireguard_profiles | selectattr('name', 'defined') | list | length }}
    network_wireguard_unique_profile_count: >-
      {{ network_wireguard_profiles | map(attribute='name') | unique | list | length }}
  changed_when: false
  tags:
    - network
    - config

- name: Assert WireGuard profile names are unique
  ansible.builtin.assert:
    that:
      - network_wireguard_named_profile_count == network_wireguard_profile_count
      - network_wireguard_unique_profile_count == network_wireguard_profile_count
    fail_msg: Each WireGuard profile must define a unique name.
  changed_when: false
  tags:
    - network
    - config

- name: Enable NetworkManager service
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started
  become: true
  tags:
    - network
    - services

- name: List existing WireGuard connections in NetworkManager
  ansible.builtin.command:
    cmd: nmcli --terse --escape no --fields NAME,UUID,TYPE connection show
  become: true
  register: network_wg_connections
  changed_when: false
  tags:
    - network
    - config

- name: Configure WireGuard profiles
  ansible.builtin.include_tasks:
    file: wireguard-profile.yml
    apply:
      tags:
        - network
        - config
        - wireguard
  loop: '{{ network_wireguard_profiles }}'
  loop_control:
    loop_var: network_wireguard_profile
    label: '{{ network_wireguard_profile.name }}'
  when: network_wireguard_profiles | length > 0
  tags:
    - network
    - config
    - wireguard
