---
- name: Install NetworkManager and wireguard tools
  community.general.pacman:
    name:
      - networkmanager
      - wireguard-tools
    state: present
  become: true
  tags: [network, packages]

- name: Deploy WireGuard config from vault
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  become: true
  tags: [network, config]

- name: Enable NetworkManager service
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started
  become: true
  tags: [network, services]

- name: Check whether WireGuard connection already exists in NetworkManager
  ansible.builtin.command:
    cmd: nmcli --terse --fields NAME,TYPE connection show
  become: true
  register: network_wg_connections
  changed_when: false
  tags: [network, config]

- name: Import WireGuard connection to NetworkManager
  ansible.builtin.command:
    cmd: nmcli connection import type wireguard file /etc/wireguard/wg0.conf
  become: true
  register: network_wg_import
  changed_when: true
  when: "'wg0:wireguard' not in network_wg_connections.stdout_lines"
  tags: [network, config]
