---
- name: Install NetworkManager and wireguard tools
  community.general.pacman:
    name:
      - networkmanager
      - wireguard-tools
    state: present
  become: true
  tags: [network, packages]

- name: Deploy WireGuard config from vault
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  become: true
  register: network_wg_config
  tags: [network, config]

- name: Enable NetworkManager service
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started
  become: true
  tags: [network, services]

- name: Check whether WireGuard connection already exists in NetworkManager
  ansible.builtin.command:
    cmd: nmcli --terse --fields NAME,TYPE connection show wg0
  become: true
  register: network_wg_connection
  failed_when: false
  changed_when: false
  tags: [network, config]

- name: Import WireGuard connection to NetworkManager
  ansible.builtin.command:
    cmd: nmcli connection import type wireguard file /etc/wireguard/wg0.conf
  become: true
  register: network_wg_import
  changed_when: true
  when: network_wg_connection.rc != 0
  tags: [network, config]

- name: Remove existing WireGuard connection before re-import
  ansible.builtin.command:
    cmd: nmcli connection delete wg0
  become: true
  changed_when: true
  when:
    - network_wg_connection.rc == 0
    - network_wg_config.changed
  tags: [network, config]

- name: Re-import updated WireGuard connection to NetworkManager
  ansible.builtin.command:
    cmd: nmcli connection import type wireguard file /etc/wireguard/wg0.conf
  become: true
  changed_when: true
  when:
    - network_wg_connection.rc == 0
    - network_wg_config.changed
  tags: [network, config]
