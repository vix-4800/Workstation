---
- name: Install firewall packages
  community.general.pacman:
    name: [nftables, firewalld]
    state: present
  become: true
  tags: [network, packages]

- name: Disable standalone nftables service (managed by firewalld)
  ansible.builtin.systemd:
    name: nftables
    enabled: false
    state: stopped
  become: true
  failed_when: false
  tags: [network, services]

- name: Enable firewalld service
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  become: true
  tags: [network, services]
