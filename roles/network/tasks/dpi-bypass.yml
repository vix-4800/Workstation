---
- name: Install zapret2 runtime dependencies
  community.general.pacman:
    name:
      - nftables
      - libnetfilter_queue
    state: present
  become: true
  when: network_dpi_bypass_provider == 'zapret2'
  tags: [network, packages]

- name: Download zapret2 release archive
  ansible.builtin.get_url:
    url: "https://github.com/bol-van/zapret2/releases/download/v{{ network_zapret2_version }}/zapret2-v{{ network_zapret2_version }}.tar.gz"
    dest: "/tmp/zapret2-v{{ network_zapret2_version }}.tar.gz"
    mode: "0644"
  become: true
  when: network_dpi_bypass_provider == 'zapret2'
  tags: [network, packages]

- name: Ensure /opt/zapret2 directory exists
  ansible.builtin.file:
    path: /opt/zapret2
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: network_dpi_bypass_provider == 'zapret2'
  tags: [network, packages]

- name: Extract zapret2 release archive
  ansible.builtin.unarchive:
    src: "/tmp/zapret2-v{{ network_zapret2_version }}.tar.gz"
    dest: /opt/zapret2
    remote_src: true
    extra_opts: ["--strip-components=1"]
    owner: root
    group: root
    creates: /opt/zapret2/init.d/sysv/zapret2
  become: true
  when: network_dpi_bypass_provider == 'zapret2'
  tags: [network, packages]

- name: Ensure zapret2 custom.d directory exists
  ansible.builtin.file:
    path: /opt/zapret2/init.d/sysv/custom.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: network_dpi_bypass_provider == 'zapret2'
  tags: [network, config]

- name: Deploy zapret2 config
  ansible.builtin.template:
    src: zapret2.config.j2
    dest: /opt/zapret2/config
    owner: root
    group: root
    mode: "0644"
  become: true
  when: network_dpi_bypass_provider == 'zapret2'
  tags: [network, config]

- name: Deploy zapret2 QUIC custom script
  ansible.builtin.copy:
    src: zapret2/custom.d/50-quic4all
    dest: /opt/zapret2/init.d/sysv/custom.d/50-quic4all
    owner: root
    group: root
    mode: "0755"
  become: true
  when: network_dpi_bypass_provider == 'zapret2'
  tags: [network, config]

- name: Install zapret2 systemd service
  ansible.builtin.copy:
    src: /opt/zapret2/init.d/systemd/zapret2.service
    dest: /etc/systemd/system/zapret2.service
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  become: true
  when: network_dpi_bypass_provider == 'zapret2'
  tags: [network, config]

- name: Enable zapret2 systemd service
  ansible.builtin.systemd:
    name: zapret2.service
    enabled: "{{ network_zapret2_service_enabled | bool }}"
    state: "{{ 'started' if network_zapret2_service_enabled else 'stopped' }}"
    daemon_reload: true
  become: true
  when: network_dpi_bypass_provider == 'zapret2'
  tags: [network, services]
