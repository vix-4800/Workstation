[General]
# Always enable Bluetooth adapters on boot
AutoEnable=true

# Keep discoverable mode time-bounded and pairing explicit
DiscoverableTimeout=180
PairableTimeout=180
AlwaysPairable=false

# Prefer stable defaults unless specific hardware requires otherwise
Experimental=false
KernelExperimental=false
FastConnectable=false

# Use network privacy mode by default
Privacy=network

[Policy]
# Auto-enable all controllers when they are found
AutoEnable=true

# Reconnect to previously paired devices automatically
ReconnectAttempts=7
ReconnectIntervals=1,2,4,8,16,32,64

# Delay before reconnecting after resume from suspend
ResumeDelay=2
