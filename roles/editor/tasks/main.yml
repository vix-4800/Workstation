---
- name: Install editor packages
  community.general.pacman:
    name: "{{ editor_packages }}"
    state: present
  become: true
  tags: [editor, packages]

- name: Install Visual Studio Code (AUR)
  kewlfft.aur.aur:
    name: visual-studio-code-bin
    state: present
  become: false
  tags: [editor, packages]

- name: Deploy editor configs
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/editor/files/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ editor_configs }}"
  loop_control:
    label: "{{ item.src }}"
  tags: [editor, config]

- name: Deploy editor templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop: "{{ editor_templates }}"
  loop_control:
    label: "{{ item.src }}"
  tags: [editor, config]
