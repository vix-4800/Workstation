---
- name: Deploy environment variables
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/roles/base/files/environment'
    dest: /etc/environment
    state: link
    force: true
  become: true
  tags:
    - base
    - system

- name: Deploy user-dirs config
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/roles/base/files/user-dirs.dirs'
    dest: '{{ home }}/.config/user-dirs.dirs'
    state: link
    force: true
  tags:
    - base
    - config

- name: Deploy fontconfig
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/roles/base/files/fontconfig'
    dest: '{{ home }}/.config/fontconfig'
    state: link
    force: true
  tags:
    - base
    - config

- name: Deploy editorconfig
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/roles/base/files/.editorconfig'
    dest: '{{ home }}/.editorconfig'
    state: link
    force: true
  tags:
    - base
    - config
