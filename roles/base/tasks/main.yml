---
- name: Set locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: ^#?{{ base_locale }}
    line: '{{ base_locale }} UTF-8'
  become: true
  notify: Generate locale
  tags:
    - base
    - system

- name: Deploy locale.conf
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: |
      LANG={{ base_locale }}
    mode: '0644'
  become: true
  tags:
    - base
    - system

- name: Set timezone
  community.general.timezone:
    name: '{{ base_timezone }}'
  become: true
  tags:
    - base
    - system

- name: Set hostname
  ansible.builtin.copy:
    content: '{{ hostname }}'
    dest: /etc/hostname
    owner: root
    group: root
    mode: '0644'
  become: true
  tags:
    - base
    - system

- name: Install base packages
  ansible.builtin.import_tasks: packages.yml
  tags:
    - base
    - packages

- name: Update mirror list with reflector
  ansible.builtin.command:
    cmd: >-
      reflector --country {{ base_reflector_country }} --latest 10 --age 24
      --sort rate --save /etc/pacman.d/mirrorlist
  become: true
  changed_when: false
  tags:
    - base
    - system

- name: Deploy base configs
  ansible.builtin.import_tasks: config.yml
  tags:
    - base

- name: Set vm.swappiness for SSD/NVMe performance
  ansible.posix.sysctl:
    name: vm.swappiness
    value: '10'
    state: present
    sysctl_file: /etc/sysctl.d/99-vm.conf
  become: true
  tags:
    - base
    - system

- name: Deploy paccache systemd units
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/roles/base/files/systemd/system/{{ item }}'
    dest: /etc/systemd/system/{{ item }}
    state: link
    force: true
  become: true
  loop:
    - paccache.service
    - paccache.timer
  tags:
    - base
    - system

- name: Enable paccache timer
  ansible.builtin.systemd:
    name: paccache.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true
  tags:
    - base
    - services

- name: Deploy reflector systemd units
  ansible.builtin.file:
    src: '{{ dotfiles_dir }}/roles/base/files/systemd/system/{{ item }}'
    dest: /etc/systemd/system/{{ item }}
    state: link
    force: true
  become: true
  loop:
    - reflector.service
    - reflector.timer
  tags:
    - base
    - system

- name: Enable reflector timer
  ansible.builtin.systemd:
    name: reflector.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true
  tags:
    - base
    - services
