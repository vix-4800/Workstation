---
- name: Install greetd
  community.general.pacman:
    name: [greetd, greetd-regreet]
    state: present
  become: true
  tags: [display-manager, packages]

- name: Deploy greetd config
  ansible.builtin.copy:
    src: config.toml
    dest: /etc/greetd/config.toml
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [display-manager, system]

- name: Deploy greeter Sway config
  ansible.builtin.copy:
    src: sway-config
    dest: /etc/greetd/sway-config
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [display-manager, system]

- name: Deploy greetd PAM config
  ansible.builtin.copy:
    src: pam.d/greetd
    dest: /etc/pam.d/greetd
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [display-manager, system]

- name: Ensure system backgrounds directory exists
  ansible.builtin.file:
    path: /usr/share/backgrounds
    state: directory
    mode: "0755"
  become: true
  tags: [display-manager, system]

- name: Check if ReGreet wallpaper destination is a symlink
  ansible.builtin.stat:
    path: "/usr/share/backgrounds/{{ wallpaper_file }}"
  register: wallpaper_stat
  become: true
  tags: [display-manager, system]

- name: Remove ReGreet wallpaper symlink
  ansible.builtin.file:
    path: "/usr/share/backgrounds/{{ wallpaper_file }}"
    state: absent
  when: wallpaper_stat.stat.exists and wallpaper_stat.stat.islnk
  become: true
  tags: [display-manager, system]

- name: Deploy ReGreet wallpaper
  ansible.builtin.copy:
    src: "{{ dotfiles_dir }}/roles/appearance/files/wallpapers/{{ wallpaper_file }}"
    dest: "/usr/share/backgrounds/{{ wallpaper_file }}"
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  become: true
  tags: [display-manager, system]

- name: Deploy ReGreet config
  ansible.builtin.template:
    src: regreet.toml.j2
    dest: /etc/greetd/regreet.toml
    owner: greeter
    group: greeter
    mode: "0644"
  become: true
  tags: [display-manager, system]

- name: Enable greetd service
  ansible.builtin.systemd:
    name: greetd
    enabled: true
  become: true
  tags: [display-manager, services]
