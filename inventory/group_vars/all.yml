---
# Common variables shared across all workstations

# Connection (always local — this playbook runs on the machine it configures)
ansible_connection: local

home: "/home/{{ username }}"
dotfiles_dir: "{{ playbook_dir }}"

# Appearance
theme: catppuccin-mocha
font_family: "JetBrainsMono Nerd Font"
cursor_theme: catppuccin-mocha-lavender-cursors
cursor_size: 24
icon_theme: Papirus-Dark
gtk_theme: "catppuccin-mocha-lavender-standard+default"

# Shell & terminal
default_shell: /usr/bin/fish
terminal: alacritty
editor: nvim

# Desktop
compositor: sway
bar: waybar
launcher: wofi
lock: gtklock
notifications: swaync
