---
# Hadolint configuration for Dockerfile linting
# See: https://github.com/hadolint/hadolint

# Override rules
override:
  error:
    - DL3001 # Switch to `cd` to using WORKDIR
    - DL3002 # Last USER should not be root
    - DL3025 # Use JSON notation for CMD and ENTRYPOINT

  warning:
    - DL3003 # Use WORKDIR to switch to a directory
    - DL3004 # Do not use sudo
    - DL3007 # Using latest tag
    - DL3009 # Delete apt-get lists after installing
    - DL3015 # Avoid additional packages by using --no-install-recommends

  info:
    - DL3006 # Always tag image version
    - DL3008 # Pin versions in apt-get
    - DL3013 # Pin versions in pip
    - DL3018 # Pin versions in apk

  style:
    - DL3010 # Use ADD for tar archives
    - DL3011 # Valid UNIX ports

# Allowed registries
# allowed-registries:
#   - docker.io
#   - gcr.io

# Label schema
label-schema:
  author: text
  version: semver
  description: text
  maintainer: text
