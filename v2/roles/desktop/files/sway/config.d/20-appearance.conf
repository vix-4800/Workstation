# Appearance configuration

# ===== Visual Effects =====
# Gaps and borders
smart_gaps on
smart_borders on
gaps inner 12
gaps outer 5
default_border pixel 2
default_floating_border pixel 3

# Corner radius for windows
corner_radius 12

# Blur effects for modern look
blur enable
blur_passes 2
blur_radius 8

# Shadows for floating windows
shadows enable
shadow_blur_radius 20
shadow_color #00000099

# ===== Dimming Effects =====
default_dim_inactive 0.25
dim_inactive_colors.unfocused #000000FF
dim_inactive_colors.urgent #900000FF

# ===== Title Bar =====
titlebar_padding 8 2
title_align center
titlebar_border_thickness 0

# ===== Mouse & Focus =====
focus_follows_mouse yes
focus_on_window_activation smart
mouse_warping output

# ===== Cursor Theme =====
seat seat0 xcursor_theme catppuccin-mocha-lavender-cursors 24

# ===== Opacity Settings =====
for_window [app_id=".*"] opacity 0.90
