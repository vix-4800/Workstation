---
- name: Install fonts
  community.general.pacman:
    name:
      - ttf-jetbrains-mono-nerd
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
    state: present
  become: true
  tags: [appearance, packages]

- name: Install cursor theme
  kewlfft.aur.aur:
    name: catppuccin-cursors-mocha
    state: present
  become: false
  tags: [appearance, packages]

- name: Install icon theme
  community.general.pacman:
    name: papirus-icon-theme
    state: present
  become: true
  tags: [appearance, packages]

- name: Deploy GTK configs
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/gtk/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "2.0", dest: "{{ ansible_env.HOME }}/.gtkrc-2.0" }
    - { src: "3.0", dest: "{{ ansible_env.HOME }}/.config/gtk-3.0" }
    - { src: "4.0", dest: "{{ ansible_env.HOME }}/.config/gtk-4.0" }
  loop_control:
    label: "GTK {{ item.src }}"
  tags: [appearance, config]

- name: Deploy bat config and themes
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/bat"
    dest: "{{ ansible_env.HOME }}/.config/bat"
    state: link
    force: true
  tags: [appearance, config]

- name: Build bat cache
  ansible.builtin.command:
    cmd: bat cache --build
  changed_when: false
  tags: [appearance, config]

- name: Deploy wallpapers
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/wallpapers"
    dest: "{{ ansible_env.HOME }}/.local/share/wallpapers"
    state: link
    force: true
  tags: [appearance, config]

- name: Deploy GRUB theme
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/themes/grub/catppuccin-mocha-grub-theme"
    dest: /boot/grub/themes/catppuccin-mocha
    state: link
    force: true
  become: true
  tags: [appearance, config]

- name: Deploy Plymouth theme
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/appearance/files/themes/plymouth/catppuccin-mocha"
    dest: /usr/share/plymouth/themes/catppuccin-mocha
    state: link
    force: true
  become: true
  tags: [appearance, config]
