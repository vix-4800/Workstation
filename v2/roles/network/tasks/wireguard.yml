---
- name: Install wireguard-tools
  community.general.pacman:
    name: wireguard-tools
    state: present
  become: true
  tags: [network, packages]

- name: Deploy WireGuard config from vault
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  become: true
  tags: [network, system]

- name: Import WireGuard connection to NetworkManager
  ansible.builtin.command:
    cmd: nmcli connection import type wireguard file /etc/wireguard/wg0.conf
  register: wg_import
  changed_when: "'successfully added' in wg_import.stdout"
  failed_when: false
  tags: [network, system]
